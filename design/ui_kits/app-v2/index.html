<title>Форма — прототип интерфейса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;400;600;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* ── Forma tokens, straight from src/styles/global.css ───────────────────── */
:root{
  --bg:#0f0f11; --surface:#17171a; --surface-2:#1f1f24; --surface-3:#2a2a30;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --text:#f6f6f7; --muted:#b9b9c0; --muted-2:#93939d;
  --paper:#ffffff; --ink:#0f0f11; --border-ink:rgba(15,15,17,.14);
  --course:#f2f52d;           /* Форма с нуля */
  --game:#f08a3c;             /* игра */
  --on-course:#0f0f11;
  --success:#7ce0b0; --warning:#ffd166; --danger:#ff6b6b;
  --font-display:'Unbounded',system-ui,sans-serif;
  --font-sans:'Onest',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --stage:#141416;            /* prototype ground, outside the device */
}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* ── type ────────────────────────────────────────────────────────────────── */
.display{font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  letter-spacing:-.01em;line-height:1.16}
.fd{font-family:var(--font-display);font-weight:600;text-transform:uppercase;line-height:1.28}
.thin{font-weight:200}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  line-height:1.3;color:var(--muted)}
.ctl{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.glyph{font-family:var(--font-display);font-weight:600;line-height:1;display:inline-flex}
.num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:0}
.muted{color:var(--muted)} .muted2{color:var(--muted-2)}

/* ── prototype chrome ────────────────────────────────────────────────────── */
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;gap:32px;
  padding:0}
.device{position:relative;width:100%;max-width:420px;height:calc(100dvh - 30px);overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column}
.index{display:none}
@media(min-width:980px){
  .stage{padding:40px 32px;align-items:center}
  .device{height:844px}
  .device{height:844px;max-height:calc(100dvh - 80px);border:1px solid var(--border-strong)}
  .index{display:block;width:250px;flex:none;position:sticky;top:40px}
}
.index h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  font-size:15px;letter-spacing:.02em;margin:0 0 4px}
.index p{font-size:12px;line-height:1.5;color:var(--muted-2);margin:0 0 20px}
.index .grp{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-2);margin:18px 0 6px}
.index a{display:block;padding:5px 0;font-size:13px;color:var(--muted);text-decoration:none;
  border-bottom:1px solid transparent}
.index a:hover{color:var(--text)}
.index a[aria-current]{color:var(--text);font-weight:600}

/* the floating screen picker, phones only */
.pick{position:fixed;left:0;right:0;bottom:0;z-index:90;height:30px;display:flex;align-items:center;
  justify-content:center;gap:8px;background:#000;color:var(--muted-2);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase}
.pick b{color:var(--text);font-weight:700}
@media(min-width:980px){.pick{display:none}}
.sheet{position:fixed;inset:0;z-index:100;background:rgba(15,15,17,.94);
  padding:24px 20px calc(env(safe-area-inset-bottom,0px) + 24px);overflow:auto;display:none}
.sheet[data-open]{display:block}
.sheet .grp{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-2);margin:20px 0 8px}
.sheet a{display:block;padding:11px 0;border-top:1px solid var(--border);font-size:15px;
  color:var(--text);text-decoration:none}
.sheet .close{position:absolute;top:16px;right:16px;font-size:22px}

/* ── screen scaffolding ──────────────────────────────────────────────────── */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:0 24px}
.top{display:flex;align-items:center;gap:12px;padding:18px 24px 0}
.tabs{display:flex;border-top:1px solid var(--border);background:var(--bg);flex:none}
.tabs button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;position:relative;color:var(--muted-2)}
.tabs button[aria-current]{color:var(--text)}
.tabs button[aria-current]::before{content:"";position:absolute;top:-1px;left:0;right:0;height:2px;
  background:var(--text)}
.tabs .lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ── shared pieces ───────────────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;
  padding:13px 18px;text-align:center;line-height:1.35;background:var(--paper);color:var(--ink);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;font-size:12px;transition:opacity .15s var(--ease)}
.btn:active{transform:scale(.985)}
.btn.sec{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
.btn.ghost{background:none;color:var(--muted);border:0;min-height:44px}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.05) brightness(.92)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.5'/></svg>")}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,15,17,.6),transparent 28%,rgba(15,15,17,.5) 58%,rgba(15,15,17,.97))}
.hairline{border-top:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  border:1px solid var(--border-strong);font-size:12px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text);white-space:nowrap}
.note{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:120;
  background:var(--paper);color:var(--ink);font-size:12px;font-weight:600;padding:9px 14px;
  max-width:min(92vw,360px);text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease)}
.note[data-on]{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<style>
/* ── auth ────────────────────────────────────────────────────────────────── */
.auth{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 24px calc(env(safe-area-inset-bottom,0px) + 32px)}
.auth .bg{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.auth .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(15,15,17,.55),rgba(15,15,17,.35) 38%,rgba(15,15,17,.92))}
.auth .card{position:absolute;inset:0;display:grid;place-items:center;z-index:3;
  transition:opacity .7s var(--ease);pointer-events:none}
.auth .form{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:40px;transition:opacity .7s var(--ease)}
.wm{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  white-space:nowrap;line-height:1}
.wm i{font-style:normal;display:inline-block;transform:scaleX(1.22);transform-origin:left center;
  margin-right:.16em}
.wm b{font-weight:800} .wm s{text-decoration:none;font-weight:200}
.field{width:100%;height:52px;display:flex;align-items:center;padding:0 16px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:16px;
  text-align:center;font-family:var(--font-sans)}
.field::placeholder{color:var(--muted-2)}
.code{display:flex;gap:8px;justify-content:center;width:100%}
.code span{flex:1;max-width:52px;height:56px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);font-family:var(--font-display);
  font-weight:600;font-size:22px}
.code span:first-child{border-color:var(--text)}

/* ── cover card (home today / programmes deck) ───────────────────────────── */
.cover{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;background:var(--bg)}
.cover.flat{background:var(--tile,var(--surface-2));color:var(--on-course)}
.cover .inner{position:relative;z-index:2;padding:0 24px 32px}
.cover h2{margin:12px 0 0;font-size:24px}
.cover .lead{margin:16px 0 0;font-size:15px;line-height:1.5;max-width:30ch}
.cover .btn{margin-top:26px}
.pager{display:flex;justify-content:center;gap:8px;padding-top:18px}
.pager i{display:block;width:28px;height:2px;background:var(--border-strong)}
.pager i[data-on]{background:var(--text)}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.deck>div{flex:none;width:100%;scroll-snap-align:center}

/* ── game block on home ──────────────────────────────────────────────────── */
.gameblock{border-left:2px solid var(--game);padding:2px 0 2px 16px;display:flex;
  flex-direction:column;gap:10px}
.gameblock .ttl{font-size:17px;font-weight:600}
.teaser{position:relative;overflow:hidden;border:1px solid var(--border-strong);padding:20px;
  display:flex;flex-direction:column;gap:12px}
.teaser .blur{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}

/* ── task rows ───────────────────────────────────────────────────────────── */
.rows{border-bottom:1px solid var(--border)}
.rows button{display:flex;align-items:center;gap:16px;width:100%;padding:18px 0;text-align:left;
  border-top:1px solid var(--border)}
.rows .n{width:32px;flex:none;font-size:14px;color:var(--muted-2)}
.rows .t{flex:1;min-width:0;font-size:15px}
.rows .h{display:block;margin-top:3px;font-size:13px;color:var(--muted-2)}

/* ── path ────────────────────────────────────────────────────────────────── */
.pathhead{background:var(--course);color:var(--on-course);padding:18px 24px 24px;margin:0}
.weekstrip{display:flex;gap:10px;margin-top:22px}
.weekstrip i{flex:1;border-top:2px solid currentColor;opacity:.3;padding-top:8px;
  font-family:var(--font-display);font-weight:600;font-size:13px;font-style:normal}
.weekstrip i[data-on]{opacity:1}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
.figs>*{padding:18px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;
  gap:8px;text-align:left}
.figs>*:first-child{border-left:0;padding-left:24px}
.figs .v{font-family:var(--font-display);font-weight:600;font-size:24px;
  font-variant-numeric:tabular-nums}
.weekband{background:var(--course);color:var(--on-course);display:flex;align-items:baseline;
  justify-content:space-between;padding:12px 24px;margin:0 -24px}
.stops{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.stop{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:12px}
.stop .tile{aspect-ratio:1;width:100%;max-width:62px;border:2px solid var(--border);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:600;font-size:17px;
  font-variant-numeric:tabular-nums;color:var(--muted-2);opacity:.55}
.stop[data-s=open] .tile{border-color:var(--border-strong);color:var(--text);opacity:1}
.stop[data-s=current] .tile{border-color:var(--paper);background:var(--paper);color:var(--ink);
  opacity:1}
.stop[data-s=done] .tile{background:var(--course);border-color:var(--course);color:var(--on-course);
  opacity:1}
.stop .name{font-size:13px;font-weight:600;line-height:1.35}
.stop .meta{display:block;margin-top:5px;font-size:12px;font-weight:500;color:var(--muted-2);
  line-height:1.35}
.stop[data-s=current] .meta{color:var(--course)}

/* ── difficulty ──────────────────────────────────────────────────────────── */
.diff{display:flex;flex-direction:column;gap:10px}
.diff button{display:flex;align-items:center;gap:20px;padding:20px 16px;text-align:left;
  border:1px solid var(--border);width:100%}
.diff button[data-rec]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.diff .mins{display:flex;flex-direction:column;align-items:center;flex:none;width:56px}
.diff .mins b{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1;
  font-variant-numeric:tabular-nums}
.diff .mins span{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  opacity:.6;margin-top:7px}
.diff .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.diff .bar{height:3px;background:var(--surface-3)}
.diff button[data-rec] .bar{background:rgba(15,15,17,.25)}
.diff .bar i{display:block;height:100%;background:var(--muted-2)}
.diff button[data-rec] .bar i{background:var(--ink)}

/* ── player ──────────────────────────────────────────────────────────────── */
.play{position:relative;flex:1;overflow:hidden;background:var(--bg);
  perspective:1600px}
.face{position:absolute;inset:0;backface-visibility:hidden;transition:transform .5s var(--ease)}
.play[data-flip] .front{transform:rotateY(180deg)}
.play .back{transform:rotateY(180deg);background:var(--surface);display:flex;flex-direction:column}
.play[data-flip] .back{transform:rotateY(360deg)}
.art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.art img{max-width:100%;max-height:100%;object-fit:contain;
  filter:grayscale(1) contrast(1.05) brightness(.92)}
.phead{position:absolute;inset:0 0 auto;z-index:3;padding-top:2px;
  background:linear-gradient(180deg,rgba(15,15,17,.55),rgba(15,15,17,.2) 60%,transparent)}
.prog{height:2px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;background:var(--course)}
.prow{display:flex;align-items:center;height:56px;padding:0 12px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;background:rgba(15,15,17,.55);
  border:1px solid rgba(255,255,255,.25);color:#fff}
.glass{position:absolute;inset:auto 0 0;z-index:3;border-top:1px solid rgba(255,255,255,.15);
  background:linear-gradient(180deg,rgba(15,15,17,.35),rgba(15,15,17,.65) 40%,rgba(15,15,17,.82));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:26px 24px calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.clock{font-family:var(--font-display);font-weight:600;font-size:60px;line-height:1;
  font-variant-numeric:tabular-nums}
.slider{width:100%;display:flex;flex-direction:column;gap:8px}
.slider .tr{position:relative;height:2px;background:rgba(255,255,255,.22)}
.slider .tr i{display:block;height:100%;background:var(--paper)}
.slider .tr b{position:absolute;top:-4px;width:2px;height:10px;background:var(--paper);
  transform:translateX(-1px)}
.slider .ends{display:flex;justify-content:space-between;font-size:11px;
  font-variant-numeric:tabular-nums;color:rgba(246,246,247,.65)}
.stepper{display:flex;align-items:center;justify-content:center;gap:24px}
.stepper .sq{width:48px;height:48px;border:1px solid var(--border-strong);display:grid;
  place-items:center;font-family:var(--font-display);font-size:20px}
.stepper .cnt{font-family:var(--font-display);font-weight:600;font-size:60px;line-height:1;
  font-variant-numeric:tabular-nums;min-width:100px}
.skip{position:absolute;left:0;right:0;bottom:calc(100% + 14px);display:flex;justify-content:center;
  transition:opacity .6s var(--ease)}
.skip[data-gone]{opacity:0;pointer-events:none}
.paused[hidden]{display:none}
.paused{position:absolute;inset:0;z-index:10;background:var(--bg);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 24px;
  text-align:center}
.paused .acts{width:100%;margin-top:14px;border-bottom:1px solid var(--border)}
.paused .acts button{width:100%;padding:15px 0;border-top:1px solid var(--border);
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.backhead{display:flex;align-items:center;gap:8px;padding:14px 12px 14px 24px;
  border-bottom:1px solid var(--border)}
.tabsfill{display:flex;border:1px solid var(--border-strong);margin:20px 24px 0}
.tabsfill button{flex:1;padding:11px 0;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted-2)}
.tabsfill button[aria-current]{background:var(--paper);color:var(--ink)}
.howto{padding:20px 24px 32px;display:flex;flex-direction:column;gap:2px}
.howto li{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--border);font-size:14px;
  line-height:1.5;list-style:none}
.howto li b{font-family:var(--font-display);font-weight:600;color:var(--muted-2);flex:none}
.howto ol,.howto ul{margin:0;padding:0}

/* ── game ────────────────────────────────────────────────────────────────── */
.taskcard{border-top:1px solid var(--border);padding:22px 0;display:flex;flex-direction:column;
  gap:12px}
.taskcard[data-done]{opacity:.6}
.board{border-bottom:1px solid var(--border)}
.board .r{display:flex;align-items:center;gap:12px;padding:15px 0;border-top:1px solid var(--border)}
.board .r[data-me]{border-left:2px solid var(--paper);padding-left:12px}
.board .rk{width:32px;flex:none;font-family:var(--font-display);font-weight:600;font-size:15px;
  font-variant-numeric:tabular-nums;color:var(--muted-2)}
.board .r[data-top] .rk{color:var(--text)}
.board .nm{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:15px;
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pt{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:15px}

/* ── progress (paper poster) ─────────────────────────────────────────────── */
.poster{background:var(--paper);color:var(--ink);padding:26px 24px 30px;margin:0}
.poster .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.poster .big{font-family:var(--font-display);font-weight:600;font-size:104px;line-height:.86;
  font-variant-numeric:tabular-nums;margin:26px 0 0}
.poster .cap{font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  font-size:18px;margin:10px 0 0}
.poster .three{display:flex;border-top:1px solid var(--border-ink);margin-top:30px;padding-top:18px}
.poster .three>div{flex:1;border-left:1px solid var(--border-ink);padding:0 10px 0 16px}
.poster .three>div:first-child{border-left:0;padding-left:0}
.poster .three b{display:block;font-family:var(--font-display);font-weight:600;font-size:20px;
  font-variant-numeric:tabular-nums}
.poster .three span{display:block;margin-top:6px;font-size:11px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;color:#4c4c53}
.goal{display:flex;flex-direction:column;gap:12px}
.goal .track{display:flex;gap:6px}
.goal .track i{flex:1;height:6px;background:var(--surface-3)}
.goal .track i[data-on]{background:var(--paper)}
.miles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mile{border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;
  min-height:118px}
.mile[data-on]{border-color:var(--border-strong)}
.mile .mk{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--border-strong);
  font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted-2)}
.mile[data-on] .mk{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.mile .mt{font-family:var(--font-display);font-weight:600;font-size:13px;line-height:1.3}
.mile .md{font-size:12px;color:var(--muted)}
.rail{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px}
.rail::-webkit-scrollbar{display:none}
.rail>*{flex:none;width:46%;max-width:210px}

/* ── profile (paper) ─────────────────────────────────────────────────────── */
.paper{background:var(--paper);color:var(--ink);flex:1;min-height:0;overflow-y:auto}
.paper .lrow{display:flex;align-items:center;gap:14px;padding:17px 24px;
  border-top:1px solid var(--border-ink);width:100%;text-align:left;font-size:15px}
.avatar{width:36px;height:36px;flex:none;display:grid;place-items:center;background:var(--surface-2);

const every = (ms,fn)=>{ timers.push(setInterval(fn,ms)); };
const after = (ms,fn)=>{ timers.push(setTimeout(fn,ms)); };
function toast(msg){ const n=$('#note'); n.textContent=msg; n.setAttribute('data-on',''); 
  clearTimeout(n._t); n._t=setTimeout(()=>n.removeAttribute('data-on'),1800); }

function wirePlayer(){
  const play=$('#play'), art=$('#art'), paused=$('#paused');
  if(art) art.addEventListener('click',()=>{ paused.hidden=false; });
  const r=$('#resume'); if(r) r.addEventListener('click',()=>{ paused.hidden=true; });
  const f=$('#flipbtn'); if(f) f.addEventListener('click',()=>play.setAttribute('data-flip',''));
  const c=$('#closeback'); if(c) c.addEventListener('click',()=>play.removeAttribute('data-flip'));
  const p=$('#pausebtn'); if(p) p.addEventListener('click',()=>{ paused.hidden=false; });
  let y0=null;
  if(art){ art.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
    art.addEventListener('touchend',e=>{ if(y0!==null && y0-e.changedTouches[0].clientY>48)
      play.setAttribute('data-flip',''); y0=null; },{passive:true}); }
}
const artFrame = src => `<img src="${src}" alt=""><div class="grain"></div>`;

S['player-warmup'] = () => {
  after(0,wirePlayer);
  after(5600,()=>{ const s=$('#skip'); if(s) s.setAttribute('data-gone',''); });
  let left=40;
  after(0,()=>every(1000,()=>{ left=left>0?left-1:0; const c=$('#pclock'); if(c) c.textContent=clock(left);
    const b=$('#pfill'); if(b) b.style.width=`${(40-left)/40*100}%`;
    const e=$('#pelapsed'); if(e) e.textContent=clock(40-left); }));
  return playerShell({ progress:4, skip:true, art:artFrame(IMG.r05),
    glass:`<span class="eyebrow" style="color:rgba(246,246,247,.6)">Разминка · 1 из 5</span>
      <h2 class="display" style="font-size:20px;margin:0">${WARMUP[0]}</h2>
      <div class="clock" id="pclock">0:40</div>

        <div class="ends"><span id="pelapsed">0:00</span><span>0:40</span></div></div>` });
};

    const pc=(total-left)/total*100; const b=$('#pfill'); if(b) b.style.width=pc+'%';
    const k=$('#pknob'); if(k) k.style.left=pc+'%';
    const e=$('#pelapsed'); if(e) e.textContent=clock(total-left); }));
  return playerShell({ progress:46, art:artFrame(IMG.r01),
    glass:`<span class="eyebrow" style="color:rgba(246,246,247,.6)">Круг 2 из 3</span>

/* ── router ──────────────────────────────────────────────────────────────── */
function go(id){
  timers.forEach(t=>{clearInterval(t);clearTimeout(t)}); timers=[];
  if(!S[id]) id='home-game';
  $('#device').innerHTML = S[id]();
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.toast)));
  document.querySelectorAll('#idx a,#sheetList a').forEach(a=>
    a.dataset.id===id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  $('#sheet').removeAttribute('data-open');
  const nm=document.querySelector('#pickName');
  if(nm){ for(const [,items] of SCREENS){ const f=items.find(x=>x[0]===id); if(f) nm.textContent=f[1]; } }
  location.hash = id;
}
function buildIndex(){
  const html = SCREENS.map(([g,items])=>
    `<div class="grp">${g}</div>`+items.map(([id,t])=>`<a href="#${id}" data-id="${id}">${t}</a>`).join('')).join('');
  $('#idx').innerHTML = html; $('#sheetList').innerHTML = html;
  document.querySelectorAll('#idx a,#sheetList a').forEach(a=>
    a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.id)}));
}
$('#pick').addEventListener('click',()=>$('#sheet').setAttribute('data-open',''));
$('#sheetClose').addEventListener('click',()=>$('#sheet').removeAttribute('data-open'));
buildIndex();
go(location.hash.slice(1) || 'home-game');
</script>
