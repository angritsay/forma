<title>Форма — прототип интерфейса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;400;600;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  --accent:#ffffff;   /* what this screen is about; set per screen */
  --bg:#0f0f11; --surface:#17171a; --surface-2:#1f1f24; --surface-3:#2a2a30;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.18);
  --text:#f6f6f7; --muted:#b9b9c0; --muted-2:#93939d;
  --paper:#ffffff; --ink:#0f0f11; --border-ink:rgba(15,15,17,.14);
  --course:#f2f52d; --game:#f08a3c; --on-course:#0f0f11;
  --danger:#ff6b6b;
  --font-display:'Unbounded',system-ui,sans-serif;
  --font-sans:'Onest',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --stage:#0a0a0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  transition:transform .12s var(--ease)}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* ── type ────────────────────────────────────────────────────────────────── */
.display{font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  letter-spacing:-.015em;line-height:1.08;hyphens:auto}
.fd{font-family:var(--font-display);font-weight:600;text-transform:uppercase;line-height:1.28}
.thin{font-weight:200}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  line-height:1.3;color:var(--muted)}
.glyph{font-family:var(--font-display);font-weight:600;line-height:1;display:inline-flex}
.num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.muted{color:var(--muted)} .muted2{color:var(--muted-2)}

/* ── motion: the whole point of this pass ────────────────────────────────── */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.82)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes halo{0%{transform:scale(1);opacity:.55}70%{transform:scale(1.7);opacity:0}100%{opacity:0}}
@keyframes tick{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes burst{0%{transform:scale(.3);opacity:0}30%{opacity:1}100%{transform:scale(1.9);opacity:0}}
@keyframes sweep{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.rise{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.pop{animation:popin .42s var(--spring) both;animation-delay:calc(var(--i,0)*45ms)}
.sweep{animation:sweep .4s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.ticking{animation:tick .35s var(--ease)}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

/* ── stage ───────────────────────────────────────────────────────────────── */
.stage{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;gap:34px}
.device{position:relative;width:100%;max-width:420px;height:calc(100dvh - 30px);overflow:hidden;
  background:var(--bg);display:flex;flex-direction:column}
.index{display:none}
@media(min-width:980px){
  .stage{padding:36px 32px;align-items:center}
  .device{height:846px;max-height:calc(100dvh - 72px);border:1px solid var(--border-strong)}
  .index{display:block;width:246px;flex:none}
}
.index h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:15px;
  margin:0 0 6px}
.index p{font-size:12px;line-height:1.55;color:var(--muted-2);margin:0 0 18px}
.index .grp{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-2);margin:18px 0 6px}
.index a{display:block;padding:5px 0;font-size:13px;color:var(--muted);text-decoration:none}
.index a:hover{color:var(--text)}
.index a[aria-current]{color:var(--text);font-weight:600}
.pick{position:fixed;left:0;right:0;bottom:0;z-index:90;height:30px;display:flex;align-items:center;
  justify-content:center;gap:8px;background:#000;color:var(--muted-2);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase}
.pick b{color:var(--text)}
@media(min-width:980px){.pick{display:none}}
.sheet{position:fixed;inset:0;z-index:100;background:rgba(10,10,11,.96);
  padding:24px 20px 60px;overflow:auto;display:none}
.sheet[data-open]{display:block}
.sheet .grp{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted-2);margin:22px 0 6px}
.sheet a{display:block;padding:12px 0;border-top:1px solid var(--border);font-size:15px;
  color:var(--text);text-decoration:none}
.sheet .close{position:absolute;top:14px;right:16px;font-size:24px}

/* ── scaffolding ─────────────────────────────────────────────────────────── */
.screen{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:0 24px}
.tabs{display:flex;border-top:1px solid var(--border);background:var(--bg);flex:none}
.tabs button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:5px;position:relative;color:var(--muted-2)}
.tabs button[aria-current]{color:var(--text)}
.tabs .dot{position:absolute;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);
  opacity:0;transform:scale(.4);transition:all .3s var(--spring)}
.tabs button[aria-current] .dot{opacity:1;transform:scale(1)}
.tabs .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

/* ── controls ────────────────────────────────────────────────────────────── */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;
  padding:14px 20px;background:var(--paper);color:var(--ink);font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;font-size:12px;text-align:center;line-height:1.35}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn.ghost{background:none;color:var(--muted);min-height:44px}
.btn .glyph{transition:transform .25s var(--ease)}
.btn:hover .glyph{transform:translateX(3px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;
  border:1px solid var(--border-strong);font-size:12px;font-weight:600;letter-spacing:.04em;
  white-space:nowrap;border-radius:999px}
.chip.solid{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.chip.course{background:var(--accent);color:var(--on-course);border-color:var(--accent)}

/* ── photography, the emotional surface ──────────────────────────────────── */
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:grayscale(1) contrast(1.18) brightness(.86)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.4;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>")}
.scrim{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,15,17,.72) 0%,rgba(15,15,17,.12) 34%,rgba(15,15,17,.62) 68%,rgba(15,15,17,.98) 100%)}
.round{border-radius:50%;overflow:hidden;position:relative;flex:none}

/* ── rings: the shape that carries the joy ───────────────────────────────── */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:butt}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1.1s var(--ease)}
.ring .mid{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1}
.halo{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--paper);
  animation:halo 2.4s var(--ease) infinite}
/* ── the display scale, deliberately loud ────────────────────────────────── */
.d-hero{font-size:clamp(40px,12.5vw,58px)}     /* the one line on a cover      */
.d-scr{font-size:clamp(32px,9vw,40px)}          /* a screen's own title         */
.d-move{font-size:clamp(28px,8vw,36px)}         /* the movement in the player   */
.n-huge{font-size:clamp(96px,34vw,132px);line-height:.82;letter-spacing:-.04em}
.n-big{font-size:clamp(60px,20vw,76px);line-height:.9;letter-spacing:-.03em}
.n-mid{font-size:34px;line-height:1}

/* ── auth ────────────────────────────────────────────────────────────────── */
.auth{position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 24px 40px}
.auth .bg{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.auth .veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(15,15,17,.5),rgba(15,15,17,.3) 40%,rgba(15,15,17,.94))}
.auth .card{position:absolute;inset:0;display:grid;place-items:center;z-index:3;
  transition:opacity .8s var(--ease),transform .8s var(--ease);pointer-events:none}
.auth .form{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  gap:34px;transition:opacity .7s var(--ease)}
.wm{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  white-space:nowrap;line-height:1}
.wm i{font-style:normal;display:inline-block;transform:scaleX(1.22);transform-origin:left center;
  margin-right:.16em}
.wm s{text-decoration:none;font-weight:200}
.field{width:100%;height:56px;display:flex;align-items:center;padding:0 18px;
  background:rgba(255,255,255,.07);border:1px solid var(--border-strong);color:var(--text);
  font-size:16px;text-align:center;font-family:var(--font-sans)}
.field::placeholder{color:var(--muted-2)}

/* ── cover cards ─────────────────────────────────────────────────────────── */
.cover{position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;background:var(--bg)}
.cover.flat{background:var(--tile,var(--surface-2));color:var(--on-course)}
.cover .inner{position:relative;z-index:2;padding:0 24px 30px}
.cover .lead{margin:14px 0 0;font-size:15px;line-height:1.5;max-width:26ch;opacity:.85}
.cover .btn{margin-top:24px}
.cover .stats{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.pager{display:flex;justify-content:center;gap:7px;padding-top:16px}
.pager i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);
  transition:all .3s var(--spring)}
.pager i[data-on]{background:var(--accent);transform:scale(1.35)}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.deck>div{flex:none;width:100%;scroll-snap-align:center}

/* ── home extras ─────────────────────────────────────────────────────────── */
.gamerow{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);width:100%;text-align:left}
.teaser{position:relative;overflow:hidden;border:1px solid var(--border-strong);padding:24px;
  display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.teaser .blur{filter:blur(6px);opacity:.5;pointer-events:none;user-select:none}
.rows{border-bottom:1px solid var(--border)}
.rows button{display:flex;align-items:center;gap:16px;width:100%;padding:18px 0;text-align:left;
  border-top:1px solid var(--border)}
.rows .t{flex:1;min-width:0;font-size:15px}
.rows .h{display:block;margin-top:3px;font-size:13px;color:var(--muted-2)}

/* ── path ────────────────────────────────────────────────────────────────── */
.pathhead{background:var(--accent);color:var(--on-course);padding:20px 24px 26px}
.figs{display:flex;border-bottom:1px solid var(--border)}
.figs>*{flex:1;padding:20px 12px 20px 24px;border-left:1px solid var(--border);display:flex;
  flex-direction:column;gap:8px;text-align:left}
.figs>*:first-child{border-left:0}
.figs .v{font-family:var(--font-display);font-weight:600;font-size:26px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.weekband{background:var(--accent);color:var(--on-course);display:flex;align-items:baseline;
  justify-content:space-between;padding:11px 24px;margin:0 -24px}
.stops{position:relative;display:flex;flex-direction:column;gap:20px;margin-top:24px}
.stop{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:12px}
.stop .tile{aspect-ratio:1;width:100%;max-width:64px;border:2px solid var(--border);
  border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);
  font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;color:var(--muted-2);
  opacity:.5;position:relative}
.stop[data-s=open] .tile{border-color:var(--border-strong);color:var(--text);opacity:1}
.stop[data-s=current] .tile{border-color:var(--paper);background:var(--paper);color:var(--ink);
  opacity:1;font-size:22px}
.stop[data-s=done] .tile{background:var(--accent);border-color:var(--accent);color:var(--on-course);
  opacity:1}
.stop .name{font-size:15px;font-weight:600;line-height:1.3}
.stop .meta{display:block;margin-top:5px;font-size:12.5px;color:var(--muted-2);line-height:1.35}

/* ── difficulty ──────────────────────────────────────────────────────────── */
.diff{display:flex;flex-direction:column;gap:12px}
.diff button{display:flex;align-items:center;gap:20px;padding:18px;text-align:left;width:100%;
  border:1px solid var(--border)}
.diff button[data-rec]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.diff .mins b{font-family:var(--font-display);font-weight:600;font-size:42px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.diff .mins span{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  opacity:.55;display:block;margin-top:6px}
.diff .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.diff .bar{height:4px;background:var(--surface-3);border-radius:999px;overflow:hidden}
.diff button[data-rec] .bar{background:rgba(15,15,17,.2)}
.diff .bar i{display:block;height:100%;background:var(--muted-2);border-radius:999px;
  transition:width .9s var(--ease)}
.diff button[data-rec] .bar i{background:var(--ink)}

/* ── player ──────────────────────────────────────────────────────────────── */
.play{position:relative;flex:1;overflow:hidden;background:var(--bg);perspective:1600px}
.face{position:absolute;inset:0;backface-visibility:hidden;transition:transform .55s var(--ease)}
.play[data-flip] .front{transform:rotateY(180deg)}
.play .back{transform:rotateY(180deg);background:var(--surface);display:flex;flex-direction:column}
.play[data-flip] .back{transform:rotateY(360deg)}
.art{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.2) brightness(.8)}
.phead{position:absolute;inset:0 0 auto;z-index:3;
  background:linear-gradient(180deg,rgba(15,15,17,.6),rgba(15,15,17,.15) 65%,transparent)}
.prog{height:3px;background:rgba(255,255,255,.14)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .6s var(--ease)}
.prow{display:flex;align-items:center;height:58px;padding:0 14px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(15,15,17,.5);border:1px solid rgba(255,255,255,.25);color:#fff;
  backdrop-filter:blur(8px)}
.pcenter[data-ink]{color:var(--on-course)}
.pcenter[data-ink] .eyebrow{color:rgba(15,15,17,.6)!important}
.pcenter[data-ink] .ring .trk{stroke:rgba(15,15,17,.18)}
.pcenter[data-ink] .ring .val{stroke:var(--ink)!important}
.pcenter[data-ink] .display{color:var(--on-course)}
.pcenter{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:22px;padding:0 24px;text-align:center;pointer-events:none}
.pbottom{position:absolute;inset:auto 0 0;z-index:3;padding:0 24px 30px;display:flex;
  flex-direction:column;align-items:center;gap:18px;
  background:linear-gradient(180deg,transparent,rgba(15,15,17,.75) 40%,rgba(15,15,17,.95))}
.skip{transition:opacity .7s var(--ease)}
.skip[data-gone]{opacity:0;pointer-events:none}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px}
.stepper .sq{width:52px;height:52px;border-radius:50%;border:1px solid var(--border-strong);
  display:grid;place-items:center;font-family:var(--font-display);font-size:22px}
.paused[hidden]{display:none}
.paused{position:absolute;inset:0;z-index:10;background:rgba(15,15,17,.97);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 24px;
  text-align:center}
.paused .acts{width:100%;margin-top:12px;border-bottom:1px solid var(--border)}
.paused .acts button{width:100%;padding:16px 0;border-top:1px solid var(--border);font-size:11px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.backhead{display:flex;align-items:center;gap:8px;padding:16px 14px 16px 24px;
  border-bottom:1px solid var(--border)}
.tabsfill{display:flex;gap:8px;margin:20px 24px 0}
.tabsfill button{flex:1;padding:11px 0;font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted-2);border:1px solid var(--border);border-radius:999px}
.tabsfill button[aria-current]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.howto{padding:22px 24px 34px;margin:0;list-style:none}
.howto li{display:flex;gap:16px;padding:15px 0;border-top:1px solid var(--border);font-size:15px;
  line-height:1.5}
.howto li b{font-family:var(--font-display);font-weight:600;color:var(--accent);flex:none}

/* ── the celebration ─────────────────────────────────────────────────────── */
.done{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;padding:0 24px;overflow:hidden;text-align:center}
.rays{position:absolute;top:50%;left:50%;translate:-50% -50%;width:min(150vw,620px);aspect-ratio:1;pointer-events:none;
  animation:burst 1.5s var(--ease) both}
.rays i{position:absolute;top:50%;left:50%;width:1px;height:50%;background:
  linear-gradient(180deg,rgba(255,255,255,.55),transparent);transform-origin:top center}
.done .three{display:flex;gap:0;margin-top:34px;border-top:1px solid var(--border);width:100%;
  padding-top:20px}
.done .three>div{flex:1;border-left:1px solid var(--border);padding-left:16px;text-align:left}
.done .three>div:first-child{border-left:0;padding-left:0}

/* ── game ────────────────────────────────────────────────────────────────── */
.taskcard{border-top:1px solid var(--border);padding:24px 0;display:flex;flex-direction:column;
  gap:14px}
.taskcard[data-done]{opacity:.55}
.board .r{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
.board .rk{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:600;font-size:14px;color:var(--muted-2);
  border:1px solid var(--border)}
.board .r[data-top] .rk{color:var(--text);border-color:var(--border-strong)}
.board .r[data-me] .rk{background:var(--accent);color:var(--on-course);border-color:var(--accent)}
.board .nm{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:15px;
  text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pt{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;
  font-size:17px;letter-spacing:-.02em}

/* ── «Ты» ────────────────────────────────────────────────────────────────── */
.poster{position:relative;background:var(--paper);color:var(--ink);padding:26px 24px 32px;
  overflow:hidden}
.poster .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.poster .cap{font-family:var(--font-display);font-weight:800;text-transform:uppercase;
  font-size:20px;margin:6px 0 0;letter-spacing:-.01em}
.poster .three{display:flex;border-top:1px solid var(--border-ink);margin-top:28px;padding-top:18px}
.poster .three>div{flex:1;border-left:1px solid var(--border-ink);padding:0 10px 0 16px}
.poster .three>div:first-child{border-left:0;padding-left:0}
.poster .three b{display:block;font-family:var(--font-display);font-weight:600;font-size:22px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.poster .three span{display:block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.16em;

function toast(m){const n=$('#note');n.textContent=m;n.style.opacity='1';
  clearTimeout(n._t);n._t=setTimeout(()=>n.style.opacity='0',1700);}

/* a ring — the shape that carries the joy, and the one circle the brand allows */
function ring(size,stroke,pct,inner,color){
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<span class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" aria-hidden="true">
      <circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
        stroke-dasharray="${c}" stroke-dashoffset="${c}" data-fill="${(c*(1-pct)).toFixed(1)}"
        ${color?`style="stroke:${color}"`:''}/>
    </svg><span class="mid">${inner}</span></span>`;
}
/* numbers arrive by counting, never by appearing */
function animate(){
  document.querySelectorAll('[data-fill]').forEach(el=>
    requestAnimationFrame(()=>{el.style.strokeDashoffset=el.dataset.fill}));
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=+el.dataset.count, dur=900, t0=performance.now(), fmt=el.dataset.fmt==='sp';
    const step=t=>{const k=Math.min(1,(t-t0)/dur), v=Math.round(to*(1-Math.pow(1-k,3)));
      el.textContent=fmt?v.toLocaleString('ru-RU'):v; if(k<1)requestAnimationFrame(step);};
    el.textContent='0'; requestAnimationFrame(step);
  });
}

function shell({art,centre,bottom,flip,progress}){
  return `<div class="screen"><div class="play" id="play" ${flip?'data-flip':''}>
    <div class="face front">
      <div class="art" id="art">${art}<div class="grain"></div>

      <div class="phead"><div class="prog"><i style="width:${progress}%"></i></div>
        <div class="prow">
          <button class="iconbtn" data-go="path" aria-label="Выйти"><span class="glyph">‹</span></button>
          <span style="flex:1"></span>
          <button class="iconbtn" id="pausebtn" aria-label="Пауза">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="currentColor"><rect x="1.5" y="1" width="3.5" height="11" rx="1"/><rect x="8" y="1" width="3.5" height="11" rx="1"/></svg>
          </button></div></div>
      <div class="pcenter" ${art.includes('var(--course)')?'data-ink':''}>${centre}</div>
      <div class="pbottom">${bottom}</div>
      <div class="paused" id="paused" hidden>
        <span class="display" style="font-size:40px">Пауза</span>
        <p class="muted" style="margin:0;font-size:15px;max-width:26ch">Таймеры стоят. Возвращайся, когда захочешь.</p>
        <button class="btn" id="resume" style="width:auto;padding:14px 34px;margin-top:10px">Продолжить</button>
        <div class="acts">
          <button data-go="player-timer">Пропустить разминку</button>
          <button data-toast="Шаг начнётся заново">Начать шаг заново</button>
          <button data-go="path" style="color:var(--danger)">Завершить тренировку</button></div>
      </div>
    </div>
    <div class="face back">
      <div class="backhead"><span class="fd" style="flex:1;font-size:17px">Приседания</span>
        <button class="glyph" id="closeback" aria-label="Закрыть" style="font-size:22px">×</button></div>
      <div class="tabsfill"><button aria-current="page">Техника</button><button data-toast="Советы">Советы</button><button data-toast="Осторожно">Осторожно</button></div>
      <div class="scroll"><ol class="howto">
        <li><b>01</b><span>Поставь стопы чуть шире таза, носки слегка наружу.</span></li>
        <li><b>02</b><span>Отведи таз назад и вниз, колени идут за носками.</span></li>
        <li><b>03</b><span>Опустись так, чтобы таз был ниже колен, спина ровная.</span></li>
        <li><b>04</b><span>Встань, полностью выпрямив колени и таз.</span></li>
      </ol></div>
    </div></div></div>`;
}
function wire(){
  const play=$('#play'),art=$('#art'),paused=$('#paused');
  const open=()=>{paused.hidden=false};
  if(art)art.addEventListener('click',open);
  const r=$('#resume'); if(r)r.addEventListener('click',()=>paused.hidden=true);
  const p=$('#pausebtn'); if(p)p.addEventListener('click',e=>{e.stopPropagation();open()});
  const f=$('#flipbtn'); if(f)f.addEventListener('click',e=>{e.stopPropagation();play.setAttribute('data-flip','')});
  const c=$('#closeback'); if(c)c.addEventListener('click',()=>play.removeAttribute('data-flip'));
  let y0=null;
  if(art){art.addEventListener('touchstart',e=>y0=e.touches[0].clientY,{passive:true});
    art.addEventListener('touchend',e=>{if(y0!==null&&y0-e.changedTouches[0].clientY>48)
      play.setAttribute('data-flip','');y0=null},{passive:true});}
}
const howtoBtn=`<button id="flipbtn" style="font-size:11px;color:rgba(246,246,247,.65);display:flex;gap:7px;align-items:center;font-weight:600;letter-spacing:.1em;text-transform:uppercase">Как делать <span class="glyph" style="font-size:13px">⟲</span></button>`;

S['player-warmup']=()=>{
  after(0,wire); after(6000,()=>{const s=$('#skip');if(s)s.setAttribute('data-gone','')});
  let left=40; const total=40;
  after(0,()=>every(1000,()=>{left=left>0?left-1:0;
    const c=$('#pclock'); if(c){c.textContent=clk(left);c.classList.remove('ticking');void c.offsetWidth;c.classList.add('ticking')}
    const v=$('.ring .val'); if(v)v.style.strokeDashoffset=(v.dataset.circ*(left/total)).toFixed(1);}));
  const r=(140-6)/2, circ=2*Math.PI*r;
  return shell({progress:4,art:`<div style="position:absolute;inset:0;background:var(--course)"></div>`,
    centre:`<span class="eyebrow pop" style="color:rgba(246,246,247,.7)">Разминка · 1 из 5</span>
      <h2 class="display d-move pop" style="--i:1;margin:0">Круги <span class="thin">головой</span></h2>

        </svg><span class="mid"><span class="num" id="pclock" style="font-size:38px">0:40</span></span></span>
      </div>`,
    bottom:`<div class="skip" id="skip"><button class="chip" data-go="player-timer">Пропустить разминку</button></div>
      ${howtoBtn}`});
};

S['player-timer']=()=>{
  after(0,wire);
  let left=38; const total=60;
  after(0,()=>every(1000,()=>{left=left>0?left-1:0;
    const c=$('#pclock'); if(c){c.textContent=clk(left);c.classList.remove('ticking');void c.offsetWidth;c.classList.add('ticking')}
    const v=$('.ring .val'); if(v)v.style.strokeDashoffset=(v.dataset.circ*(left/total)).toFixed(1);
    if(left===0) setTimeout(()=>go('done'),600);}));
  const r=(200-7)/2, circ=2*Math.PI*r;
  return shell({progress:46,art:`<img src="${IMG.hero}" alt="">`,
    centre:`<span class="eyebrow pop" style="color:rgba(246,246,247,.7)">Круг 2 из 3</span>
      <h2 class="display d-move pop" style="--i:1;margin:0">Ягодичный <span class="thin">мост</span></h2>

            stroke-dashoffset="${circ*0.37}" data-circ="${circ}" style="stroke:var(--accent);transition:stroke-dashoffset 1s linear"/>
        </svg><span class="mid"><span class="num n-big" id="pclock">0:38</span>

      </div>`,
    bottom:howtoBtn});
};

S['player-reps']=()=>{
  after(0,()=>{wire(); let n=12; const v=$('#cnt');
    const set=k=>{n=Math.max(0,n+k);v.textContent=n;v.classList.remove('ticking');void v.offsetWidth;v.classList.add('ticking');};

/* ── router ──────────────────────────────────────────────────────────────── */
function go(id){
  timers.forEach(t=>{clearInterval(t);clearTimeout(t)}); timers=[];
  if(!S[id]) id='home-game';
  const ACCENT={"auth": "var(--paper)", "home-game": "var(--paper)", "home-nogame": "var(--paper)", "home-nocourse": "var(--paper)", "programs": "var(--paper)", "path": "var(--course)", "difficulty": "var(--course)", "player-warmup": "var(--course)", "player-timer": "var(--course)", "player-reps": "var(--course)", "player-back": "var(--course)", "done": "var(--course)", "game": "var(--game)", "you": "var(--paper)", "profile": "var(--paper)"};
  $('#device').style.setProperty('--accent', ACCENT[id] || 'var(--paper)');
  $('#device').innerHTML=S[id]();
  document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
  document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toast(b.dataset.toast)}));
  document.querySelectorAll('#idx a,#sheetList a').forEach(a=>
    a.dataset.id===id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.querySelectorAll('.diff .bar i').forEach(i=>requestAnimationFrame(()=>i.style.width=i.dataset.w+'%'));
  animate();
  after(1300,()=>document.querySelectorAll('.rise,.pop,.sweep')
    .forEach(el=>el.classList.remove('rise','pop','sweep')));
  $('#sheet').removeAttribute('data-open');
  const nm=$('#pickName');
  if(nm) for(const [,items] of SCREENS){const f=items.find(x=>x[0]===id); if(f) nm.textContent=f[1];}
  location.hash=id;
}
function buildIndex(){
  const html=SCREENS.map(([g,items])=>`<div class="grp">${g}</div>`+
    items.map(([id,t])=>`<a href="#${id}" data-id="${id}">${t}</a>`).join('')).join('');
  $('#idx').innerHTML=html; $('#sheetList').innerHTML=html;
  document.querySelectorAll('#idx a,#sheetList a').forEach(a=>
    a.addEventListener('click',e=>{e.preventDefault();go(a.dataset.id)}));
}
$('#pick').addEventListener('click',()=>$('#sheet').setAttribute('data-open',''));
$('#sheetClose').addEventListener('click',()=>$('#sheet').removeAttribute('data-open'));
buildIndex();
go(location.hash.slice(1)||'home-game');
</script>
