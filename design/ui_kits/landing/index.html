<!-- @dsCard group="Landing" viewport="1280x800" name="Лендинг FORMA" subtitle="Редакционная асимметричная композиция" -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORMA — кроссфит дома</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;500;600;800&family=Onest:wght@400;500;600;700&display=block">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../image-slot.js"></script>
<style>body{margin:0;background:var(--bg-0);overflow-x:hidden}a{color:var(--text-2);text-decoration:none}a:hover{color:#fff}</style>
</head><body><div id="root"></div>
<script type="text/babel">

const wrap = { maxWidth: 1200, margin: '0 auto', padding: '0 40px' };
const hairline = '1px solid var(--border-1)';
const kicker = { fontFamily: 'var(--font-body)', fontSize: 11, fontWeight: 600, letterSpacing: '.16em', textTransform: 'uppercase', color: 'var(--text-3)' };
function Btn({ dark, children }) {
  return <button style={{height:52,padding:'0 30px',border:dark?'1px solid var(--border-2)':'none',background:dark?'transparent':'#fff',color:dark?'var(--text-1)':'#0b0b0d',fontFamily:'var(--font-body)',fontSize:13,fontWeight:600,letterSpacing:'.08em',textTransform:'uppercase',borderRadius:4,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:10}}>{children}</button>;
}
function Landing(){
  return <div>
    <header style={{borderBottom:hairline}}>
      <div style={{...wrap,display:'flex',alignItems:'center',height:72,gap:40}}>
        <span style={{fontFamily:'var(--font-display)',textTransform:'uppercase',fontSize:17,color:'var(--text-1)',letterSpacing:'.05em',lineHeight:1,display:'inline-flex',alignItems:'baseline',whiteSpace:'nowrap'}}><span style={{fontWeight:800,display:'inline-block',transform:'scaleX(1.22)',transformOrigin:'left center',marginRight:'.16em'}}>F</span><span style={{fontWeight:800}}>OR</span><span style={{fontWeight:200}}>MA</span></span>
        <nav style={{display:'flex',gap:28,flex:1,fontFamily:'var(--font-body)',fontSize:13,letterSpacing:'.04em'}}>
          <a href="#courses">Курсы</a><a href="#method">Метод</a><a href="#sergey">Сергей</a>
        </nav>
        <span style={{...kicker,color:'var(--text-3)'}}>Telegram Mini App</span>
      </div>
    </header>
    <section style={{...wrap,position:'relative',padding:'88px 40px 110px'}}>
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,7fr) minmax(0,5fr)',gap:0}}>
        <div style={{position:'relative',zIndex:2,paddingTop:24}}>
          <div style={kicker}>Кроссфит дома · пожизненный доступ</div>
          <h1 style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'clamp(26px,2.9vw,38px)',lineHeight:1.16,letterSpacing:'.01em',textTransform:'uppercase',color:'var(--text-1)',margin:'26px 0 0',maxWidth:600}}><span style={{fontWeight:800}}>Кроссфит дома,</span><br/><span style={{fontWeight:200}}>который подстраивается</span><br/><span style={{fontWeight:800}}>под тебя</span></h1>
          <div style={{display:'flex',alignItems:'center',gap:24,marginTop:48}}>
            <Btn>Начать бесплатно</Btn>
            <a href="#method" style={{fontFamily:'var(--font-body)',fontSize:13,fontWeight:600,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--text-1)',display:'inline-flex',alignItems:'center',gap:8}}>Как это устроено <span style={{fontFamily:'var(--font-display)',fontWeight:600}}>→</span></a>
          </div>
        </div>
        <div style={{position:'relative',marginTop:-24}}>
          <div style={{aspectRatio:'4/5',overflow:'hidden',position:'relative'}}>
            <image-slot id="hero-photo" shape="rect" src="https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=1200&q=80&sat=-100" credit="Photo by Jonathan Borba on Unsplash" credit-href="https://unsplash.com" placeholder="Фото: тренировка дома, монохром"></image-slot>
          </div>
          <div style={{position:'absolute',right:-34,top:0,writingMode:'vertical-rl',...kicker,whiteSpace:'nowrap'}}>Тренировка · 12 минут · без оборудования</div>
          <div style={{position:'absolute',left:-72,bottom:-40,background:'var(--bg-0)',padding:'22px 26px',maxWidth:280}}>
            <span style={{position:'absolute',top:0,left:0,width:14,height:14,borderTop:'2px solid var(--course-beginners)',borderLeft:'2px solid var(--course-beginners)'}}></span>
            <span style={{position:'absolute',top:0,right:0,width:14,height:14,borderTop:'2px solid var(--course-beginners)',borderRight:'2px solid var(--course-beginners)'}}></span>
            <span style={{position:'absolute',bottom:0,left:0,width:14,height:14,borderBottom:'2px solid var(--course-beginners)',borderLeft:'2px solid var(--course-beginners)'}}></span>
            <span style={{position:'absolute',bottom:0,right:0,width:14,height:14,borderBottom:'2px solid var(--course-beginners)',borderRight:'2px solid var(--course-beginners)'}}></span>
            <div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:30,color:'var(--text-1)'}}>28 <span style={{fontSize:14,color:'var(--text-3)',fontWeight:400}}>дней</span></div>
            <div style={{fontFamily:'var(--font-body)',fontSize:13,color:'var(--text-2)',marginTop:6,lineHeight:1.5}}>первый курс — от 10 минут в день, без абонемента</div>
          </div>
        </div>
      </div>
    </section>
    <section id="method" style={{borderTop:hairline}}>
      <div style={{...wrap,padding:'72px 40px 40px'}}>
        <div style={{display:'grid',gridTemplateColumns:'minmax(0,4fr) minmax(0,8fr)',gap:40}}>
          <div style={kicker}>Метод / 01–03</div>
          <div>
            {[['01','Объяснили','Сергей показывает технику на видео. Спокойно, без спешки — колени скажут спасибо.'],
              ['02','Сделали','Повторяешь в своём темпе. Нагрузка растёт вместе с тобой — без тестов на максимум.'],
              ['03','Отдохнули','Отдых — часть тренировки. Первая тренировка должна заставить захотеть прийти на вторую.']].map(([n,t,d],i)=>(
              <div key={n} style={{display:'grid',gridTemplateColumns:'80px minmax(0,220px) minmax(0,1fr)',gap:24,alignItems:'baseline',padding:'28px 0',borderTop:i? hairline:'none'}}>
                <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:15,color:'var(--text-1)'}}>{n}</span>
                <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:22,letterSpacing:'-.01em',color:'var(--text-1)'}}>{t}</span>
                <span style={{fontFamily:'var(--font-body)',fontSize:15,lineHeight:1.55,color:'var(--text-2)'}}>{d}</span>
              </div>))}
          </div>
        </div>
      </div>
    </section>
    <section id="courses" style={{borderTop:hairline}}>
      <div style={{...wrap,padding:'72px 40px'}}>
        <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between',marginBottom:40}}>
          <h2 style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:34,letterSpacing:'-.02em',color:'var(--text-1)',margin:0}}>Курсы</h2>
          <span style={kicker}>с оборудованием и без</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'minmax(0,7fr) minmax(0,5fr)',gap:24}}>
          <div style={{position:'relative',border:hairline,borderTop:'3px solid var(--course-marathon)'}}>
            <div style={{aspectRatio:'16/10',overflow:'hidden'}}>
              <image-slot id="course-1-photo" shape="rect" src="https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1200&q=80&sat=-100" credit="Photo by Meghan Holmes on Unsplash" credit-href="https://unsplash.com" placeholder="Фото курса"></image-slot>
            </div>
            <div style={{padding:'24px 26px',display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
              <div>
                <div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:24,letterSpacing:'-.01em',color:'var(--text-1)',textTransform:'uppercase'}}>Марафон-игра</div>
                <div style={{fontFamily:'var(--font-body)',fontSize:13,color:'var(--text-3)',marginTop:6}}>3 недели · команды 1+1 · очки</div>
              </div>
              <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:20,color:'var(--course-marathon)'}}>↗</span>
            </div>
          </div>
          <div style={{display:'grid',gap:24,alignContent:'stretch'}}>
            {[['Йога дома','3 недели · дыши и тянись','var(--course-yoga)'],['База для новичков','28 дней · от 10 минут в день','var(--course-beginners)']].map(([t,m,c],i)=>(
              <div key={t} style={{border:hairline,borderTop:'3px solid '+c,padding:'26px 26px 22px',display:'flex',flexDirection:'column',justifyContent:'space-between',background:i?'transparent':'var(--surface-1)'}}>
                <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:15,color:c}}>{i?'03':'02'}</span>
                <div style={{marginTop:34}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:21,letterSpacing:'-.01em',color:'var(--text-1)'}}>{t}</div>
                    <span style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:17,color:'var(--text-3)'}}>↗</span>
                  </div>
                  <div style={{fontFamily:'var(--font-body)',fontSize:13,color:'var(--text-3)',marginTop:6}}>{m}</div>
                </div>
              </div>))}
          </div>
        </div>
      </div>
    </section>
    <section id="sergey" style={{borderTop:hairline}}>
      <div style={{...wrap,padding:'88px 40px',display:'grid',gridTemplateColumns:'minmax(0,5fr) minmax(0,7fr)',gap:56,alignItems:'end'}}>
        <div style={{position:'relative'}}>
          <div style={{aspectRatio:'4/5',overflow:'hidden'}}>
            <image-slot id="sergey-photo" shape="rect" src="https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=1200&q=80&sat=-100" credit="Photo by Anastase Maragos on Unsplash" credit-href="https://unsplash.com" placeholder="Фото Сергея — монохром"></image-slot>
          </div>
          <div style={{position:'absolute',left:-14,top:40,transform:'rotate(90deg)',transformOrigin:'left top',...kicker,whiteSpace:'nowrap'}}>FORMA × Сергей Титов</div>
        </div>
        <div>
          <div style={kicker}>Тренер</div>
          <blockquote style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'clamp(26px,3vw,36px)',lineHeight:1.22,letterSpacing:'-.02em',color:'var(--text-1)',margin:'22px 0 0'}}>«Первая тренировка не должна тебя уничтожить — она должна заставить <span style={{fontStyle:'italic'}}>захотеть прийти на вторую</span>»</blockquote>
          <p style={{fontFamily:'var(--font-body)',fontSize:15,lineHeight:1.6,color:'var(--text-2)',marginTop:24,maxWidth:460}}>Сергей — тренер по кроссфиту. Техника важнее цифр: разминка сверху вниз, бережно к новичкам, без «сержанта». Его видео — в каждом упражнении.</p>
        </div>
      </div>
    </section>
    <section style={{borderTop:hairline}}>
      <div style={{...wrap,padding:'110px 40px 96px',textAlign:'left'}}>
        <div style={kicker}>Начни там, где ты сейчас</div>
        <div style={{display:'flex',flexWrap:'wrap',alignItems:'baseline',justifyContent:'space-between',gap:32,marginTop:20}}>
          <div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:'clamp(40px,5vw,60px)',letterSpacing:'-.03em',color:'var(--text-1)',lineHeight:1.05}}>Открыть FORMA</div>
          <Btn>Открыть в Telegram</Btn>
        </div>
      </div>
      <footer style={{borderTop:hairline}}>
        <div style={{...wrap,display:'flex',justifyContent:'space-between',padding:'28px 40px',fontFamily:'var(--font-body)',fontSize:12,letterSpacing:'.04em',color:'var(--text-3)'}}>
          <span>FORMA // Сергей Титов</span>
          <span>© 2026 · Кроссфит дома, который подстраивается под тебя</span>
        </div>
      </footer>
    </section>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Landing/>);
</script></body></html>
