<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg-0);padding:20px}.sw{height:96px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.n{font-family:var(--font-body);font-weight:600;font-size:12px}.h{font-family:var(--font-body);font-size:11px;opacity:.6}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">

<div class="sw" style="background:#0f0f11;border:1px solid var(--border-2);color:#f6f6f7"><span class="n">фон</span><span class="h">#0F0F11 · --bg-0</span></div>
<div class="sw" style="background:#17171a;color:#f6f6f7"><span class="n">surface-1</span><span class="h">#17171A</span></div>
<div class="sw" style="background:#1f1f24;color:#f6f6f7"><span class="n">surface-2</span><span class="h">#1F1F24</span></div>
<div class="sw" style="background:#f2f2f0;color:#0f0f11"><span class="n">бумага</span><span class="h">#F2F2F0 · --paper-2</span></div>
</div>
</body></html>
