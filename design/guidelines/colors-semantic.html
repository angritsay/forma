<!-- @dsCard group="Colors" viewport="700x230" name="Семантика" subtitle="Пастель на тёмном, чернила на светлом — обе AA" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;display:grid;grid-template-columns:1fr 1fr}.col{padding:20px}.row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--font-body);font-size:14px;font-weight:600}.dot{width:34px;height:20px;border-radius:6px;flex:none}</style></head><body>
<div class="col" style="background:#0b0b0d">
<div class="t-kicker" style="color:#85858f;margin-bottom:12px">Тёмная тема</div>
<div class="row" style="color:#7ce0b0"><span class="dot" style="background:#7ce0b0"></span>Успех #7ce0b0</div>
<div class="row" style="color:#ffd166"><span class="dot" style="background:#ffd166"></span>Предупреждение #ffd166</div>
<div class="row" style="color:#ff6b6b"><span class="dot" style="background:#ff6b6b"></span>Ошибка #ff6b6b</div>
</div>
<div class="col" style="background:#f6f5f2">
<div class="t-kicker" style="color:#7c7c85;margin-bottom:12px">Светлая тема</div>
<div class="row" style="color:#1c7a52"><span class="dot" style="background:#1c7a52"></span>Успех #1c7a52</div>
<div class="row" style="color:#8a6100"><span class="dot" style="background:#8a6100"></span>Предупреждение #8a6100</div>
<div class="row" style="color:#c53030"><span class="dot" style="background:#c53030"></span>Ошибка #c53030</div>
</div>
</body></html>
