<!--
  The app mark: the wordmark's wide F on the graphite square, with the brand's light-blue full
  stop back — third palette (design/CHANGELOG.md §14, ground darkened in §16): graphite ground,
  #afe9fd as the brand.

  The F is the anchor letter of the wordmark, stretched ×1.22 as it is in the lockup, so the
  favicon and the header are recognisably one letterform. Light ink on the dark ground: #f6f6f7
  on #121212 is 17.35:1, which is what holds it together at 16px in a tab strip.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#121212"/>
  <path d="M16 48V16h32v7H25v7h20v7H25v11z" fill="#f6f6f7"/>
  <rect x="41" y="41" width="7" height="7" fill="#afe9fd"/>
</svg>
