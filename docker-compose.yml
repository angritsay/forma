services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SYNC_TOKEN: ${SYNC_TOKEN:?set SYNC_TOKEN in .env}
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      # Bind mount: `tar` of ./data is a full backup of the server's state.
      # The app runs as uid 1000 — run `chown 1000:1000 data` before first start.
      - ./data:/data
    healthcheck:
      # node:20-slim ships no curl/wget; use node's fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    build: ./caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ROLLS_DOMAIN: ${ROLLS_DOMAIN:?set ROLLS_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
