# Apply a Supabase change from GitHub, instead of from the dashboard.
#
# The owner works from a phone. The dashboard tasks this replaces — pasting a migration into the
# SQL editor, pasting an email template into two places, deploying an edge function — are all
# "find the right screen, paste the right thing", which is exactly what is hard on a phone and
# exactly what a machine does without getting it wrong.
#
# Everything here is driven from files already in this repository. **No input carries content.**
# The task is a choice and the migration is a filename; the SQL and the templates are read from
# the checkout. That is deliberate and it is the safety property that matters: this repository is
# public, a `workflow_dispatch` input is printed on the run page forever, and an input that could
# carry SQL would be an input that could carry an email address or a key.
#
# Setup — one secret, once:
#
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  SUPABASE_ACCESS_TOKEN
#     Value: a personal access token from https://supabase.com/dashboard/account/tokens
#
# `vars.PUBLIC_SUPABASE_URL` is already set (probe-backend.yml uses it) and the project ref is
# derived from it, so there is nothing else to fill in.
#
# What this does NOT do, and cannot:
#   • DNS (SPF/DKIM/DMARC) — that is the domain's registrar, not Supabase.
#   • Prodamus — a commercial account, and confirming a locked price is a human judgement.
#   • Uploading `site/auth.mp4` — the file does not exist in this repository.
name: Supabase apply

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to apply'
        required: true
        type: choice
        options:
          - migration
          - club-seed
          - club-join
          - email-templates
          - deploy-bot
          - deploy-payments
          - secrets-check
          - webhook-info
      migration_file:
        description: 'Only for "migration": a filename in supabase/migrations/'
        required: false
        default: '0013_admin_people.sql'
        type: string

# The token is a project-wide credential. One run at a time, and never from a fork.
concurrency: supabase-apply

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the project and check the token is present
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Settings → Secrets and variables → Actions → New repository secret. Get the value from https://supabase.com/dashboard/account/tokens"
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::PUBLIC_SUPABASE_URL is not set (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          # https://<ref>.supabase.co  →  <ref>
          REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#\..*$##')
          if [ -z "$REF" ]; then
            echo "::error::Could not read a project ref out of PUBLIC_SUPABASE_URL."
            exit 1
          fi
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"
          echo "Project: $REF"

      # ---------------------------------------------------------------------
      # SQL. The statement comes from a file in the repository; the input only
      # chooses which file, and is rejected unless it is a plain basename that
      # exists under supabase/migrations/.
      # ---------------------------------------------------------------------
      - name: Run a migration
        if: ${{ inputs.task == 'migration' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: ${{ inputs.migration_file }}
        run: |
          set -euo pipefail
          case "$FILE" in
            */*|..*|'') echo "::error::migration_file must be a bare filename."; exit 1 ;;
          esac
          PATHNAME="supabase/migrations/$FILE"
          if [ ! -f "$PATHNAME" ]; then
            echo "::error::$PATHNAME does not exist. Files available:"; ls supabase/migrations/
            exit 1
          fi
          echo "Applying $PATHNAME"
          # The SQL is sent as a JSON string built by jq, so quoting inside the file cannot break out.
          jq -Rs '{query: .}' < "$PATHNAME" > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          # The response body is not printed. A query result can contain real rows, and this run
          # page is public forever.
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase returned HTTP $code. The message follows; it is the API's own error text, not row data."
            jq -r '.message // .error // "(no message)"' < /tmp/out.json || true
            exit 1
          fi
          echo "HTTP $code — applied."

      - name: Seed the club's test week
        if: ${{ inputs.task == 'club-seed' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent by construction: it rewrites the `klub_test` marathon and nothing else.
          # The tester block at the bottom of the file is commented out and stays that way — it
          # takes real email addresses and this repository is public.
          jq -Rs '{query: .}' < supabase/seed-club-week.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase returned HTTP $code."
            jq -r '.message // .error // "(no message)"' < /tmp/out.json || true
            exit 1
          fi
          echo "HTTP $code — the test week is in."
          echo "Next: run this workflow again with task = club-join, to put yourself in it."

      # ---------------------------------------------------------------------
      # The one thing in this file that takes a value rather than a filename —
      # and it takes it from a SECRET, never from an input.
      #
      # An address is personal data and a `workflow_dispatch` input is printed on
      # the run page of a public repository forever. A secret is masked in the
      # log, so the statement built from it can be built in the runner and still
      # never appear anywhere. The seed file therefore stays free of emails, which
      # is what `supabase/seed-club-week.sql` §4 promises.
      # ---------------------------------------------------------------------
      - name: Put the testers in the club's test week
        if: ${{ inputs.task == 'club-join' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # CLUB_TESTER_EMAILS if it exists, otherwise the address the backend probe
          # already uses — so this works with no new secret to create on a phone.
          EMAILS: ${{ secrets.CLUB_TESTER_EMAILS || secrets.PROBE_EMAIL }}
        run: |
          set -euo pipefail
          if [ -z "${EMAILS:-}" ]; then
            echo "::error::Neither CLUB_TESTER_EMAILS nor PROBE_EMAIL is set. Settings → Secrets and variables → Actions → New repository secret, name CLUB_TESTER_EMAILS, value your sign-in address (several are allowed, separated by commas)."
            exit 1
          fi
          # One or more addresses, separated by commas, semicolons or whitespace, turned
          # into a SQL VALUES list with every quote doubled. Written to a file rather than
          # inlined so no shell quoting stands between the secret and the statement.
          #
          # Lower-cased before `unique`, and that is not cosmetic: `marathon_members.email`
          # is `citext`, so «Owner@…» and «owner@…» are the same row, but a case-sensitive
          # `unique` lets both through and Postgres then refuses the whole statement with
          # «ON CONFLICT DO UPDATE command cannot affect row a second time». Lowercasing is
          # also what `normalize_email()` does to every address elsewhere in the schema.
          cat > /tmp/emails.jq <<'JQ'
          split("[,;\\s]+"; "")
          | map(ascii_downcase | select(length > 0))
          | unique
          | map("('" + gsub("'"; "''") + "')")
          | join(", ")
          JQ
          VALUES=$(printf '%s' "$EMAILS" | jq -Rrs -f /tmp/emails.jq)
          if [ -z "$VALUES" ]; then
            echo "::error::The secret held no address."
            exit 1
          fi
          # The statement itself.
          #
          # No team: the club is «каждый сам за себя» (`team_size = 1`), and in that mode
          # `marathon_members_check_team` refuses a member who points at one — this step
          # used to create «Пара 1» and would now fail outright. `team_id` is nulled on the
          # conflict path too, so a member left over from the paired version is un-paired
          # rather than quietly kept.
          #
          # `display_name` is left null on purpose: the board then shows the name from the
          # person's own profile, which is the name they chose.
          cat > /tmp/join.sql <<SQL
          do \$\$ begin
            if not exists (select 1 from public.marathons where slug = 'klub_test') then
              raise exception 'no klub_test marathon — run this workflow with task = club-seed first';
            end if;
          end \$\$;

          insert into public.marathon_members (marathon_id, email)
          select m.id, v.email::citext
          from public.marathons m, (values $VALUES) as v (email)
          where m.slug = 'klub_test'
          on conflict (marathon_id, email) do update set
            team_id = null,
            status  = 'active';

          do \$\$
          declare n int;
          begin
            select count(*) into n
            from public.marathon_members mm
            join public.marathons m on m.id = mm.marathon_id
            where m.slug = 'klub_test'
              and mm.status = 'active'
              and mm.email not like 'klub-test-%@example.test';
            if n = 0 then
              raise exception 'nobody was added to the club';
            end if;
            raise notice 'real members in the club: %', n;
          end \$\$;
          SQL
          jq -Rs '{query: .}' < /tmp/join.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          # Neither the statement nor the response is printed: both carry the address.
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase returned HTTP $code. The message follows; it is the API's own error text."
            jq -r '.message // .error // "(no message)"' < /tmp/out.json || true
            exit 1
          fi
          echo "HTTP $code — in the club. Open the app: the Клуб tab should show today's task and the week's table."

      # ---------------------------------------------------------------------
      # The sign-in email, into BOTH templates. Supabase sends the one-time code
      # through Magic Link, and through Confirm signup for a brand-new user, so a
      # template pasted into only one of them leaves half the users with a link
      # they cannot type into the code boxes (docs/SETUP.md §3.2).
      # ---------------------------------------------------------------------
      - name: Put the sign-in template into both slots
        if: ${{ inputs.task == 'email-templates' }}
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # The subject deliberately does NOT carry {{ .Token }}: a code in a subject line ends up
          # in notification previews and in logs (docs/SETUP.md §3.2).
          jq -n \
            --rawfile body supabase/templates/otp.html \
            --arg subject 'Код для входа в Forma' \
            '{
               mailer_subjects_magic_link: $subject,
               mailer_templates_magic_link_content: $body,
               mailer_subjects_confirmation: $subject,
               mailer_templates_confirmation_content: $body
             }' > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/body.json)
          if [ "$code" -ge 300 ]; then
            echo "::error::Supabase returned HTTP $code."
            jq -r '.message // .error // "(no message)"' < /tmp/out.json || true
            exit 1
          fi
          echo "HTTP $code — Magic Link and Confirm signup both carry the code template now."
          echo "This does not fix deliverability. SPF, DKIM and DMARC are DNS and are still outstanding (docs/SETUP.md §3.5.1)."

      # ---------------------------------------------------------------------
      # The bot: deploy it, give it its secrets, and point Telegram at it.
      #
      # **This step is the whole answer to "the Start button does nothing."**
      # Tapping Start in a Telegram chat sends `/start` to Telegram, and
      # Telegram delivers it to whatever URL `setWebhook` names. Until that call
      # is made there is no URL, so the message goes nowhere and the bot is
      # silent — which looks exactly like a broken button and is not one. The
      # call used to be left for a human to make by hand from the docs; it is
      # three secrets and a URL, so the runner makes it instead.
      #
      # Nothing here prints a token. `setWebhook` carries the bot token in its
      # path, so the URL is built into a variable and curl is given `--silent`
      # with an `-o` file; only Telegram's parsed answer is echoed, and
      # `getWebhookInfo` below returns no credential at all. `set -x` is never
      # switched on in this step for the same reason.
      # ---------------------------------------------------------------------
      - name: Deploy the Telegram bot and point Telegram at it
        if: ${{ inputs.task == 'deploy-bot' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MINI_APP_URL: ${{ vars.MINI_APP_URL }}
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /tmp
          /tmp/supabase functions deploy telegram-bot --project-ref "$PROJECT_REF" --no-verify-jwt

          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::Deployed, but TELEGRAM_BOT_TOKEN is not a GitHub secret, so the function has no token and Telegram has nowhere to deliver /start. Add it: Settings → Secrets and variables → Actions → New repository secret, name TELEGRAM_BOT_TOKEN, value the token BotFather gave you. Then run this task again."
            exit 1
          fi

          # The runtime secrets. MINI_APP_URL is optional — the function has a
          # default — and is only set when the repository variable exists.
          /tmp/supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="$BOT_TOKEN" \
            ${WEBHOOK_SECRET:+TELEGRAM_WEBHOOK_SECRET="$WEBHOOK_SECRET"} \
            ${MINI_APP_URL:+MINI_APP_URL="$MINI_APP_URL"} >/dev/null
          echo "Function deployed and its secrets set."

          # Hard failure, not a warning. The function now refuses every delivery without this
          # secret (fail closed), so deploying without it would leave a bot that answers nothing
          # and says why only in a log nobody reads. Better to stop here, with the fix in the
          # message.
          if [ -z "${WEBHOOK_SECRET:-}" ]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET is not set, and the bot function refuses every delivery without it. Generate one: openssl rand -hex 32 — then Settings → Secrets and variables → Actions → New repository secret, name TELEGRAM_WEBHOOK_SECRET, paste the value, and run this task again."
            exit 1
          fi

          HOOK_URL="https://$PROJECT_REF.functions.supabase.co/telegram-bot"
          API="https://api.telegram.org/bot$BOT_TOKEN"

          # drop_pending_updates: every /start sent while the bot was silent is
          # queued at Telegram. Replaying weeks of them at the moment the hook
          # goes live would mail a greeting to people who are long gone.
          curl -sS -o /tmp/hook.json -X POST "$API/setWebhook" \
            --data-urlencode "url=$HOOK_URL" \
            --data-urlencode "drop_pending_updates=true" \
            ${WEBHOOK_SECRET:+--data-urlencode "secret_token=$WEBHOOK_SECRET"}
          if [ "$(jq -r '.ok' < /tmp/hook.json)" != "true" ]; then
            echo "::error::setWebhook was refused: $(jq -r '.description // "(no description)"' < /tmp/hook.json)"
            exit 1
          fi
          echo "Telegram now delivers /start to $HOOK_URL"
          # Read it back, so the run says what Telegram itself believes rather
          # than what we just asked for. None of these fields is a credential.
          curl -sS -o /tmp/info.json "$API/getWebhookInfo"
          jq -r '.result | "url: \(.url)\npending: \(.pending_update_count)\nlast error: \(.last_error_message // "none")"' < /tmp/info.json
          echo
          echo "Open the bot in Telegram and press Start. It should answer with the greeting and a button."

      # ---------------------------------------------------------------------
      # deploy-payments — выкладывает функцию, которая принимает уведомления
      # Prodamus, и проверяет её живым запросом.
      #
      # Зачем отдельная задача. Функция `prodamus-webhook` лежит в репозитории с
      # самого начала, но задеплоить её было нечем: `deploy-bot` выкладывает
      # только telegram-bot, а `supabase functions deploy` из документации
      # требует терминала с установленным CLI. Владелец работает с телефона.
      # Пока функции нет по адресу, Prodamus стучится в 404 и оплата не
      # активирует ничего — молча, потому что Prodamus про это никому не
      # сообщает.
      #
      # Два секрета функция читает сама: WEBHOOK_TOKEN (он же в адресе
      # уведомления) и PRODAMUS_SECRET (им подписан каждый запрос Prodamus).
      # Их можно задать двумя путями, и шаг поддерживает оба: положить
      # одноимённые секреты в GitHub — тогда шаг перенесёт их в Supabase, как
      # `deploy-bot` переносит токен бота, — либо вписать прямо в Supabase →
      # Project Settings → Edge Functions → Secrets. Что бы ни выбрали, шаг
      # читает список имён обратно и говорит, чего не хватает.
      #
      # Ни одно значение не печатается. Адрес уведомления выводится с
      # <WEBHOOK_TOKEN> вместо токена: лог публичного репозитория — не то
      # место, где может лежать половина пропуска к выдаче платного доступа.
      # ---------------------------------------------------------------------
      - name: Deploy the payment webhook and check it answers
        if: ${{ inputs.task == 'deploy-payments' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODAMUS_SECRET: ${{ secrets.PRODAMUS_SECRET }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          # Не `set -e`: каждая ошибка разбирается явно и объясняется словами,
          # а `grep`, ничего не нашедший, — это ответ «такого секрета нет».
          set -uo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /tmp

          # --no-verify-jwt обязателен: Prodamus — сторонний сервис, он не
          # предъявляет токен Supabase. Без этого флага платформа отвечает 401
          # раньше, чем запрос доходит до кода функции.
          if ! /tmp/supabase functions deploy prodamus-webhook --project-ref "$PROJECT_REF" --no-verify-jwt; then
            echo "::error::Не удалось выложить prodamus-webhook. Обычно это просроченный SUPABASE_ACCESS_TOKEN или нет доступа к проекту."
            exit 1
          fi
          echo "::notice::Функция prodamus-webhook выложена."

          # Секреты из GitHub, если они там есть. Пусто — не ошибка: значит,
          # их задают в дашборде Supabase, и это проверяется ниже.
          args=()
          if [ -n "${PRODAMUS_SECRET:-}" ]; then args+=(PRODAMUS_SECRET="$PRODAMUS_SECRET"); fi
          if [ -n "${WEBHOOK_TOKEN:-}" ]; then args+=(WEBHOOK_TOKEN="$WEBHOOK_TOKEN"); fi
          if [ "${#args[@]}" -gt 0 ]; then
            if /tmp/supabase secrets set --project-ref "$PROJECT_REF" "${args[@]}" >/dev/null 2>&1; then
              echo "Секреты из GitHub перенесены в Supabase (${#args[@]} шт., значения не печатаются)."
            else
              echo "::error::Не удалось записать секреты в Supabase."
              exit 1
            fi
          fi

          # Читаем имена обратно — что бы их ни задало, GitHub или дашборд.
          missing=0
          if /tmp/supabase secrets list --project-ref "$PROJECT_REF" >/tmp/raw.txt 2>/dev/null; then
            grep -oE '[A-Z][A-Z0-9_]{2,}' /tmp/raw.txt | grep -vxE 'NAME|DIGEST' | sort -u > /tmp/have.txt || true
            for name in WEBHOOK_TOKEN PRODAMUS_SECRET; do
              if grep -qx -- "$name" /tmp/have.txt; then
                echo "  ✓ $name"
              else
                missing=$((missing + 1))
                if [ "$name" = "WEBHOOK_TOKEN" ]; then
                  echo "::warning::WEBHOOK_TOKEN не задан — функция отклоняет любое уведомление с «bad token». Придумай его сама (например, openssl rand -hex 16) и впиши в Supabase → Project Settings → Edge Functions → Secrets; это же значение пойдёт в адрес уведомления в Prodamus."
                else
                  echo "::warning::PRODAMUS_SECRET не задан — функция отвечает 503 на всё (fail closed). Это секретный ключ из личного кабинета Prodamus, «Настройки» → «Интеграции»; впиши его в Supabase → Project Settings → Edge Functions → Secrets."
                fi
              fi
            done
          else
            echo "::warning::Список секретов прочитать не удалось — проверь их глазами в дашборде Supabase."
          fi

          # Живая проверка. POST без токена должен получить 403 «bad token»:
          # это доказывает, что функция по адресу есть и отвечает сама, а не
          # платформа вместо неё. Ничего не пишется и ничего не выдаётся.
          URL="https://$PROJECT_REF.functions.supabase.co/prodamus-webhook"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" --data 'probe=1' || echo 000)
          case "$code" in
            403) echo "::notice::Функция отвечает по адресу (403 на запрос без токена — так и должно быть)." ;;
            401) echo "::error::401 — платформа требует токен Supabase раньше функции. Деплой прошёл без --no-verify-jwt; запусти задачу ещё раз." ; exit 1 ;;
            404) echo "::error::404 — по адресу ничего нет. Деплой не доехал; запусти задачу ещё раз." ; exit 1 ;;
            000) echo "::warning::Адрес не ответил вовсе — сеть или проект недоступен." ;;
            *)   echo "::warning::Неожиданный ответ $code. Смотри Supabase → Edge Functions → prodamus-webhook → Logs." ;;
          esac

          echo ""
          echo "Адрес для Prodamus («Настройки» → «Уведомления» → URL для оповещений):"
          echo "  $URL?token=<WEBHOOK_TOKEN>"
          echo "Вместо <WEBHOOK_TOKEN> подставь само значение секрета. Сюда оно не печатается — репозиторий публичный."
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "::error::Не задано секретов: $missing. Пока их нет, оплаты не активируют доступ."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # secrets-check — which function secrets exist, and which are missing.
      #
      # Read-only, and it prints **names only**: `supabase secrets list` shows a
      # digest rather than a value, and even that is discarded here. It exists
      # because three edge functions now refuse every request when their secret
      # is unset (fail closed), and the only way to find out used to be to send
      # a real payment and watch it not arrive.
      # ---------------------------------------------------------------------
      - name: List which function secrets are set
        if: ${{ inputs.task == 'secrets-check' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Не `set -e`: каждая ошибка обрабатывается явно, а `grep`, ничего не
          # нашедший, — это нормальный ответ «такого секрета нет», а не падение.
          set -uo pipefail
          curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz \
            | tar -xz -C /tmp

          if ! /tmp/supabase secrets list --project-ref "$PROJECT_REF" >/tmp/raw.txt 2>/tmp/err.txt; then
            echo "::error::Не удалось прочитать список секретов. Обычно это значит, что SUPABASE_ACCESS_TOKEN просрочен или у него нет доступа к проекту."
            sed 's/^/  /' /tmp/err.txt
            exit 1
          fi

          # Имена, и только имена. Вторая колонка `secrets list` — дайджест значения;
          # это не само значение, но и ему в публичном логе делать нечего. Разбор идёт
          # по словам, а не по колонкам, чтобы смена формата таблицы ничего не ломала.
          grep -oE '[A-Z][A-Z0-9_]{2,}' /tmp/raw.txt | grep -vxE 'NAME|DIGEST' | sort -u > /tmp/have.txt || true

          echo "Секреты, заданные в Supabase ($(wc -l < /tmp/have.txt)):"
          sed 's/^/  · /' /tmp/have.txt

          echo ""
          echo "Что нужно функциям:"
          missing=0
          # Держать в согласии с проверками Deno.env.get(...) в supabase/functions/*/index.ts.
          while IFS='|' read -r name why; do
            if [ -n "$name" ]; then
              if grep -qx -- "$name" /tmp/have.txt; then
                echo "  ✓ $name"
              else
                echo "::warning::$name не задан — $why"
                missing=$((missing + 1))
              fi
            fi
          done <<'NEEDED'
          TELEGRAM_BOT_TOKEN|бот не отвечает вовсе
          TELEGRAM_WEBHOOK_SECRET|бот отклоняет все запросы Telegram (fail closed)
          PRODAMUS_SECRET|оплаты не активируют подписку (fail closed)
          WEBHOOK_TOKEN|оплаты не активируют подписку
          NEEDED

          # -------------------------------------------------------------------
          # Переопределения: секреты, которые СИЛЬНЕЕ кода в репозитории.
          #
          # Бот читает текст приветствия так:
          #   Deno.env.get('TELEGRAM_GREETING') ?? DEFAULT_COPY.greeting
          # — то есть заданный секрет побеждает то, что написано в
          # supabase/functions/telegram-bot/index.ts. Сколько ни деплой новый
          # текст, в Telegram уйдёт старый, и ничего нигде не упадёт.
          #
          # Поэтому каждое найденное переопределение — предупреждение, а не
          # строчка в списке: тихое переопределение это ловушка, и она уже
          # сработала однажды.
          # -------------------------------------------------------------------
          echo ""
          echo "Переопределения (секрет важнее кода):"
          overrides=0
          while IFS='|' read -r name what; do
            if [ -n "$name" ] && grep -qx -- "$name" /tmp/have.txt; then
              echo "::warning::$name задан и перекрывает $what — правка в репозитории не подействует, пока секрет не удалён"
              overrides=$((overrides + 1))
            fi
          done <<'OVERRIDES'
          TELEGRAM_GREETING|текст приветствия бота
          TELEGRAM_PHOTO_URL|фотографию в приветствии
          TELEGRAM_BUTTON_TEXT|надпись на кнопке приложения
          TELEGRAM_SITE_BUTTON_TEXT|надпись на кнопке сайта
          TELEGRAM_SITE_URL|ссылку на сайт
          MINI_APP_URL|адрес мини-приложения
          OVERRIDES
          if [ "$overrides" -eq 0 ]; then
            echo "  нет — бот показывает то, что лежит в репозитории"
          fi

          echo ""
          if [ "$missing" -eq 0 ]; then
            echo "Всё, что нужно работающим функциям, на месте."
          else
            echo "Не задано: $missing. Задать: Supabase → Project Settings → Edge Functions → Secrets."
          fi

      # ---------------------------------------------------------------------
      # webhook-info — что об этом боте думает сам Telegram.
      #
      # Ничего не деплоит и ничего не перерегистрирует: именно поэтому он
      # отдельно от `deploy-bot`, который вызывает setWebhook с
      # drop_pending_updates=true и вместе с диагностикой стирает очередь —
      # то есть улики.
      #
      # Отвечает на вопрос «почему бот молчит», который иначе не виден ниоткуда:
      # `last_error_message` — это то, что Telegram получил, пытаясь доставить
      # обновление. «Wrong response from the webhook: 403 Forbidden» здесь
      # означает, что секрет, с которым Telegram стучится, и секрет, который
      # ждёт функция, — разные.
      #
      # Токен бота живёт в пути запроса и в вывод не попадает; в ответе
      # getWebhookInfo учётных данных нет вовсе.
      # ---------------------------------------------------------------------
      - name: Ask Telegram what it thinks of this bot
        if: ${{ inputs.task == 'webhook-info' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN не задан в секретах GitHub — спросить Telegram нечем."
            exit 1
          fi

          if ! curl -sS -o /tmp/info.json "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo"; then
            echo "::error::Не удалось обратиться к Telegram."
            exit 1
          fi

          if [ "$(jq -r '.ok' < /tmp/info.json)" != "true" ]; then
            echo "::error::Telegram отказал: $(jq -r '.description // "без объяснения"' < /tmp/info.json). Обычно это значит, что TELEGRAM_BOT_TOKEN неверный или отозван."
            exit 1
          fi

          url=$(jq -r '.result.url // ""' < /tmp/info.json)
          pending=$(jq -r '.result.pending_update_count // 0' < /tmp/info.json)
          err=$(jq -r '.result.last_error_message // ""' < /tmp/info.json)
          when=$(jq -r '.result.last_error_date // 0' < /tmp/info.json)

          if [ -z "$url" ]; then
            echo "::error::Вебхук не зарегистрирован — Telegram никуда не доставляет сообщения. Запусти задачу deploy-bot."
            exit 1
          fi
          echo "::notice::Вебхук зарегистрирован: $url"
          echo "::notice::В очереди недоставленных обновлений: $pending"

          if [ -n "$err" ]; then
            echo "::warning::Последняя ошибка доставки ($(date -u -d "@$when" '+%Y-%m-%d %H:%M UTC')): $err"
            case "$err" in
              *403*)
                echo "::warning::403 — функция отклонила запрос Telegram. Почти всегда это расхождение секретов: значение TELEGRAM_WEBHOOK_SECRET в GitHub и в Supabase должно совпадать. Приведи их к одному и запусти deploy-bot."
                ;;
              *404*|*"not found"*)
                echo "::warning::Функция не найдена по этому адресу — её нужно задеплоить: задача deploy-bot."
                ;;
              *50[0-9]*)
                echo "::warning::Функция упала при обработке. Смотри Supabase → Edge Functions → telegram-bot → Logs."
                ;;
            esac
          else
            echo "::notice::Ошибок доставки нет. Если бот всё равно молчит, причина внутри функции — Supabase → Edge Functions → telegram-bot → Logs."
          fi

          if [ "$pending" -gt 0 ]; then
            echo "::warning::$pending обновлений лежит в очереди и не доставлено — Telegram не смог их отдать."
          fi
