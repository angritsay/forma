name: Deploy site

# Builds the static site (landing + app) once and publishes it to one host.
#
# Target — repository variable DEPLOY_TARGET:
#   unset / "gh-pages-branch"  → GitHub Pages, publishing the build to the `gh-pages` branch.
#                                Needs nothing set up: pushing that branch to a public repository
#                                creates the Pages site by itself, and GITHUB_TOKEN is allowed to
#                                push it. This is the only target that needs no human step.
#   "github-pages-actions"     → GitHub Pages via actions/deploy-pages. Nicer (no build committed
#                                to a branch) but needs Settings → Pages → Source: "GitHub Actions"
#                                selected once by an admin; a workflow token cannot do it.
#   "cloudflare"               → Cloudflare Pages. Needs the two Cloudflare secrets below; the
#                                project is created automatically on the first run.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY   (required for the app to work)
#   DEPLOY_TARGET        optional — see above
#   CLOUDFLARE_PROJECT   optional — Cloudflare Pages project name, defaults to the repository name.
#                        The name is globally unique and decides the URL: <name>.pages.dev
#   SITE_URL        optional — custom domain origin, e.g. https://forma.example.com
#   BASE_PATH       optional — defaults to "/<repo>/" on github.io, "/" everywhere else
#   CUSTOM_DOMAIN   optional — writes dist/CNAME so GitHub Pages keeps the custom domain
#                   (on Cloudflare a custom domain is attached in the dashboard instead)
#   PUBLIC_YANDEX_METRIKA_ID, PUBLIC_GA_ID, PUBLIC_YANDEX_VERIFICATION, PUBLIC_GOOGLE_VERIFICATION
# Repository secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   required when DEPLOY_TARGET is "cloudflare"
#   INDEXNOW_KEY    optional — enables IndexNow submission after deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      site_url: ${{ steps.site.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Best-effort: enables GitHub Pages (source: GitHub Actions) when the workflow token is
      # allowed to. It usually is not — creating a Pages site needs an admin, so the repository
      # owner turns it on once under Settings → Pages → Source: "GitHub Actions". Never fail the
      # build here; the deploy job reports the real problem if Pages is still off.
      - name: Configure GitHub Pages
        if: ${{ vars.DEPLOY_TARGET == 'github-pages-actions' }}
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # The canonical origin is baked into the build (canonical tags, sitemap, hreflang, JSON-LD),
      # so it has to be resolved before `npm run build`, not at deploy time.
      - name: Resolve site URL and base path
        id: site
        env:
          VAR_SITE_URL: ${{ vars.SITE_URL }}
          VAR_BASE_PATH: ${{ vars.BASE_PATH }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          VAR_CF_PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER_LC="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          CF_PROJECT="${VAR_CF_PROJECT:-$REPO_NAME}"
          SITE_URL="$VAR_SITE_URL"
          BASE_PATH="$VAR_BASE_PATH"
          if [ -z "$SITE_URL" ]; then
            if [ "$DEPLOY_TARGET" = "cloudflare" ]; then
              SITE_URL="https://${CF_PROJECT}.pages.dev"
            else
              case "$REPO_NAME" in
                *.github.io) SITE_URL="https://${REPO_NAME}" ;;
                *) SITE_URL="https://${OWNER_LC}.github.io/${REPO_NAME}" ;;
              esac
            fi
          fi
          if [ -z "$BASE_PATH" ]; then
            case "$SITE_URL" in
              *github.io/*) BASE_PATH="/${REPO_NAME}/" ;;
              *) BASE_PATH="/" ;;
            esac
          fi
          echo "SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "CF_PROJECT=$CF_PROJECT" >> "$GITHUB_ENV"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "Site: $SITE_URL  Base: $BASE_PATH"

      # Until a Supabase project is configured, publish the app in demo mode (browser-local
      # backend, sign-in code shown on screen) so the deployed site is usable. Setting
      # PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_ANON_KEY switches the next deploy to the real
      # backend automatically. Set the DEMO_MODE variable to "true" to force it either way.
      - name: Resolve demo mode
        env:
          VAR_DEMO_MODE: ${{ vars.DEMO_MODE }}
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
        run: |
          if [ -n "$VAR_DEMO_MODE" ]; then
            DEMO="$VAR_DEMO_MODE"
          elif [ -z "$SUPABASE_URL" ]; then
            DEMO=true
          else
            DEMO=false
          fi
          echo "PUBLIC_DEMO_MODE=$DEMO" >> "$GITHUB_ENV"
          echo "Demo mode: $DEMO"

      - name: Generate OG images
        env:
          SITE_URL: ${{ env.SITE_URL }}
        run: npm run seo:og

      - name: Build
        env:
          SITE_URL: ${{ env.SITE_URL }}
          BASE_PATH: ${{ env.BASE_PATH }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_DEMO_MODE: ${{ env.PUBLIC_DEMO_MODE }}
          PUBLIC_YANDEX_METRIKA_ID: ${{ vars.PUBLIC_YANDEX_METRIKA_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
          PUBLIC_GOOGLE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_VERIFICATION }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: npm run build

      - name: SEO audit (fails the deploy on SEO errors)
        run: npm run seo:audit

      # CNAME is how GitHub Pages remembers a custom domain; Cloudflare keeps that in its own
      # dashboard, so the file would just be dead weight in the deployment there.
      - name: Custom domain
        if: ${{ vars.CUSTOM_DOMAIN != '' && vars.DEPLOY_TARGET != 'cloudflare' }}
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      # A Pages artifact is a plain tar of dist/, so every publish job below reuses this one upload.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publishes by pushing the build to the `gh-pages` branch, which needs no repository setting:
  # the branch itself creates the Pages site, and GITHUB_TOKEN may push it. The branch is rebuilt
  # from scratch and force-pushed every time, so its history stays one commit deep and 500+ built
  # files per deploy never accumulate in the repository.
  gh_pages_branch:
    needs: build
    if: ${{ vars.DEPLOY_TARGET == '' || vars.DEPLOY_TARGET == 'gh-pages-branch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Unpack the build
        run: |
          mkdir -p dist
          tar -xf artifact/artifact.tar -C dist

      - name: Push the build to the gh-pages branch
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site build ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          OWNER_LC="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "page_url=https://${OWNER_LC}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: ${{ vars.DEPLOY_TARGET == 'github-pages-actions' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    needs: build
    if: ${{ vars.DEPLOY_TARGET == 'cloudflare' }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact

      - name: Unpack the build
        run: |
          mkdir -p dist
          tar -xf artifact/artifact.tar -C dist
          echo "Files: $(find dist -type f | wc -l)"

      # Creating an existing project is an error, so this is best-effort: on every run after the
      # first it fails harmlessly and the deploy below does the real work.
      - name: Ensure the Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CLOUDFLARE_PROJECT || github.event.repository.name }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT || github.event.repository.name }} --branch=main

  indexnow:
    needs: [build, gh_pages_branch, deploy, cloudflare]
    if: ${{ always() && (needs.gh_pages_branch.result == 'success' || needs.deploy.result == 'success' || needs.cloudflare.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The origin the build was made for — not a deploy job's URL, which on Cloudflare is the
      # per-deployment alias (<hash>.<project>.pages.dev) rather than the canonical one.
      - name: Submit changed URLs to IndexNow (Yandex, Bing)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: ${{ needs.build.outputs.site_url }}
        run: node scripts/seo/indexnow.mjs --from-live
