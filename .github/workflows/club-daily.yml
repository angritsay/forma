name: Club daily messages

# Раз в час просит базу поставить в очередь ежедневные сообщения клуба (0052):
# утреннее задание, вечернее «серия сгорит», воскресные итоги. Отправляет их,
# как и всё остальное, telegram-notify.yml — раз в десять минут.
#
# ## Почему каждый час, а не три cron-строки
#
# У каждого круга клуба свой часовой пояс (`marathons.timezone`), а cron в
# Actions живёт в UTC. Переводить «8:00 по Москве» в UTC здесь значило бы
# переводить заново при смене пояса или появлении второго круга. Поэтому час
# решает сама функция: workflow зовёт её каждый час с каждым из трёх видов, а
# она смотрит на местное время круга и кладёт в очередь только то, чему пора,
# ровно один раз в день на человека. Лишний вызов стоит один запрос и ноль строк.
#
# Минута 7, а не 0: в начале часа Actions перегружен и запуски опаздывают
# сильнее всего. Опоздание функция переживает — окно у каждого вида два часа.
#
# ## В логе только числа
#
# Функция возвращает, сколько строк легло в очередь. Ни адресов, ни имён, ни
# текстов заданий: страница запуска публичного репозитория видна всем и остаётся
# навсегда.
#
# ## Access warnings (0054)
#
# The same hourly run also calls `club_enqueue_access_ending()`: `subscription_ending` three days
# before a subscription ends. It has no hour of its own — its window is 72 hours wide and its key
# is the period — so it runs on every tick, and prints one number like the rest.
#
# ## Who gets club messages (0062)
#
# Only paying club members — a live subscription — and admins (`club_paid_reachable`). A course
# buyer in the free club week gets nothing from this job: no daily touches and, since 0062, no
# `club_trial_tomorrow` warning (it is no longer queued). The app's club access is unchanged.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which kind to check (all — everything, as on schedule)'
        type: choice
        default: all
        options:
          - all
          - club_task
          - club_reminder
          - club_recap
          - access_ending

concurrency:
  group: club-daily
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: ubuntu-latest
    steps:
      - name: Queue what the hour calls for
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          KIND: ${{ inputs.kind || 'all' }}
        run: |
          set -uo pipefail
          # Секрета или адреса проекта нет — значит ежедневные сообщения ещё не включали,
          # и это не поломка. Красный крест каждый час приучает не смотреть на Actions,
          # а именно там видны настоящие сбои.
          if [ -z "${TOKEN:-}" ] || [ -z "${SUPABASE_URL:-}" ]; then
            echo "::notice::Ежедневные сообщения клуба ещё не включены: нет секрета SUPABASE_ACCESS_TOKEN или переменной PUBLIC_SUPABASE_URL."
            exit 0
          fi

          # https://<ref>.supabase.co → <ref>, как в supabase-apply.yml.
          PROJECT_REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://##; s#\..*$##')
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Из PUBLIC_SUPABASE_URL не читается ref проекта."
            exit 1
          fi

          case "$KIND" in
            all) KINDS="club_task club_reminder club_recap access_ending" ;;
            club_task|club_reminder|club_recap|access_ending) KINDS="$KIND" ;;
            *) echo "::error::Неизвестный вид: $KIND"; exit 1 ;;
          esac

          rc=0
          for kind in $KINDS; do
            if [ "$kind" = access_ending ]; then
              # Not a daily kind: its own function, both warnings in one call (0054).
              printf 'select public.club_enqueue_access_ending() as queued;' \
                | jq -Rs '{query: .}' > /tmp/body.json
            else
              printf 'select public.club_enqueue_daily(%s) as queued;' "'$kind'" \
                | jq -Rs '{query: .}' > /tmp/body.json
            fi
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/body.json)

            if [ "$code" -ge 300 ] && [ "$kind" = access_ending ] \
              && jq -r '.message // ""' < /tmp/out.json 2>/dev/null \
                 | grep -q 'club_enqueue_access_ending.*does not exist'; then
              # Merged before 0054 was applied: not a failure, just not switched on yet.
              echo "::notice::access_ending is not on yet: apply 0054_outbox_kinds.sql."
              continue
            fi
            if [ "$code" -ge 300 ]; then
              # Печатается только текст ошибки самого API — в нём не бывает строк таблицы.
              echo "::error::Supabase ответил HTTP $code на «$kind»."
              jq -r '.message // .error // "(без сообщения)"' < /tmp/out.json || true
              rc=1
              continue
            fi

            # Одно число на вид — и это всё, что тут можно напечатать.
            queued=$(jq -r '.[0].queued // 0' < /tmp/out.json 2>/dev/null || echo '?')
            echo "::notice::$kind — в очередь: $queued"
          done
          exit $rc
