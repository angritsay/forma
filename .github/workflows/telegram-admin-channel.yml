name: Set up the owner's Telegram channel

# Заводит в группе владельца пять тем и печатает их числовые id для секрета
# `TELEGRAM_ADMIN_TOPICS`. Запускается руками, один раз, и потом ещё раз — если тему удалили.
#
# ## Что делает человек до этого
#
# 1. Создаёт **группу** в телеграме и включает в её настройках **«Темы» (Topics)**. Именно группу с
#    темами, а не канал: в канале тем нет, и обсуждать в нём нельзя.
# 2. Добавляет туда бота и делает его **администратором** с правом **«Управление темами»**. Без
#    этого права `createForumTopic` отвечает отказом, и задача об этом скажет.
# 3. Узнаёт id группы. Самый простой способ — написать в группу что угодно и открыть
#    `https://api.telegram.org/bot<токен>/getUpdates`: в ответе будет `"chat":{"id":-100…}`. Id
#    группы с темами всегда начинается с `-100`.
# 4. Кладёт его в секрет `TELEGRAM_ADMIN_CHAT` (Settings → Secrets and variables → Actions).
#
# ## Что делает эта задача
#
# Создаёт пять тем — Регистрации, Курсы, Клуб, Онлайн-тренировки, Обращения — и пишет в каждую по
# одной строке «Канал подключён», чтобы весь путь от секрета до темы был проверен сразу, а не
# первой живой покупкой. Затем печатает готовый JSON, который надо положить в секрет
# `TELEGRAM_ADMIN_TOPICS`, и задача `deploy-notify` отнесёт его в Supabase.
#
# **Повторный запуск создаёт темы заново.** Телеграм не умеет «создать, если нет», и одинаковых
# тем станет две. Поэтому запускать имеет смысл один раз; если одну тему удалили — проще создать
# её руками и поправить одно число в секрете.
#
# ## Что печатается в лог
#
# Только имена тем и их числовые id. Ни id группы, ни токена, ни единого адреса: страница запуска
# публичного репозитория видна всем и остаётся навсегда. Id темы — это порядковый номер сообщения
# внутри группы; без id самой группы он не значит ничего.

on:
  workflow_dispatch:

concurrency:
  group: telegram-admin-channel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Create the five topics
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is not set"; exit 1
          fi
          if [ -z "${CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_ADMIN_CHAT is not set — create the group, enable Topics, add the bot as an admin, then put the group id (it starts with -100) into the secret"; exit 1
          fi

          # Имена — те же, что в TOPIC_TITLES (supabase/functions/telegram-notify/admin.ts).
          # Ключ слева уходит в секрет, подпись справа видна людям в группе.
          declare -A TITLES=(
            [signups]="Регистрации"
            [courses]="Курсы"
            [club]="Клуб"
            [sessions]="Онлайн-тренировки"
            [support]="Обращения"
          )
          ORDER="signups courses club sessions support"

          OUT="{"
          FIRST=1
          for key in $ORDER; do
            title="${TITLES[$key]}"
            body=$(jq -nc --arg chat "$CHAT_ID" --arg name "$title" \
              '{chat_id: $chat, name: $name}')
            res=$(curl -sS -X POST \
              -H 'content-type: application/json' \
              -d "$body" \
              "https://api.telegram.org/bot${BOT_TOKEN}/createForumTopic")

            ok=$(printf '%s' "$res" | jq -r '.ok')
            if [ "$ok" != "true" ]; then
              # Описание ошибки телеграма безопасно: в нём нет ни id, ни токена.
              why=$(printf '%s' "$res" | jq -r '.description // "no description"')
              echo "::error::could not create the topic \"$title\": $why"
              echo "::error::most likely the bot is not an admin of the group, or has no \"Manage topics\" right, or the group has Topics switched off"
              exit 1
            fi

            id=$(printf '%s' "$res" | jq -r '.result.message_thread_id')
            echo "::notice::$key -> $id"

            # Одна строка в каждую тему: весь путь проверен сразу, а не первой живой покупкой.
            hello=$(jq -nc --arg chat "$CHAT_ID" --argjson thread "$id" \
              '{chat_id: $chat, message_thread_id: $thread, text: "<b>Канал подключён</b>\nСюда будут приходить события этой темы.", parse_mode: "HTML"}')
            curl -sS -o /dev/null -X POST \
              -H 'content-type: application/json' -d "$hello" \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage"

            if [ $FIRST -eq 0 ]; then OUT="$OUT,"; fi
            OUT="$OUT\"$key\":$id"
            FIRST=0
          done
          OUT="$OUT}"

          echo "::notice::TELEGRAM_ADMIN_TOPICS=$OUT"
          {
            echo "### Темы созданы"
            echo
            echo "Положи это в секрет \`TELEGRAM_ADMIN_TOPICS\` (Settings → Secrets and variables → Actions),"
            echo "затем запусти **Supabase apply → \`deploy-notify\`**, чтобы секрет доехал до функции."
            echo
            echo '```json'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
