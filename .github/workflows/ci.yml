name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, test, build, SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://example.com
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (engine, content, i18n, seo scripts)
        run: npm run test

      # 0009_course_import.sql is generated from content/courses/, and supabase/course-import/ is
      # that file cut one course per part — the parts are what Supabase apply → course-import
      # sends. A course edit without regenerating both would import yesterday's courses.
      - name: Course import is fresh
        run: node scripts/content/gen-course-import.mjs --check

      - name: Course import parts are fresh
        run: node scripts/db/split-import.mjs --check

      - name: OG images
        run: npm run seo:og

      - name: Build
        run: npm run build

      - name: SEO audit
        run: npm run seo:audit
