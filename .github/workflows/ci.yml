name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check, lint, test, build, SEO audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://example.com
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests (engine, content, i18n, seo scripts)
        run: npm run test

      - name: OG images
        run: npm run seo:og

      - name: Build
        run: npm run build

      - name: SEO audit
        run: npm run seo:audit
