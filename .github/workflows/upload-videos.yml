name: Upload videos

# Transcodes the coach's exercise clips and pushes them into the private Supabase `videos` bucket,
# so the app plays real video where the fallback animation shows now. It runs the very same two
# scripts a maintainer would run locally (scripts/media/prepare-videos.mjs, then upload-videos.mjs)
# — here, so the service-role key lives only in a GitHub secret and never touches a laptop or the
# repository. The identifications come from the version-controlled media/manifest.json; prepare
# merges into it and never clears an id, so re-running is safe.
#
# The 36 identified source clips are fetched straight from the owner's Google Drive by file id
# (media/drive-files.json, generated from the export). Nothing to zip or upload by hand — the
# export's `video_files` folder only needs to be shared "anyone with the link" so the runner can
# read each file.
#
# One-time setup — Settings -> Secrets and variables -> Actions:
#   secret  SUPABASE_SERVICE_ROLE_KEY  Supabase -> Project Settings -> API -> service_role key.
#                                      It is a password (bypasses RLS); only this workflow reads it.
#   var     PUBLIC_SUPABASE_URL        already set for the app; reused here.
#
# Run it from Actions -> Upload videos -> Run workflow. Keep "dry_run" on for the first run: it
# downloads and transcodes and lists what it would upload, without writing anything and without
# needing the secret. Then run again with dry_run off.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language tag stored on each file'
        required: false
        default: 'ru'
      dry_run:
        description: 'Preview only — download, transcode and list, upload nothing (no secret needed)'
        type: boolean
        default: true

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Preconditions
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::PUBLIC_SUPABASE_URL variable is not set (Settings -> Variables)"; exit 1
          fi
          if [ "${{ inputs.dry_run }}" != "true" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is not set — add it, or keep dry_run on"; exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (includes ffmpeg-static)
        run: npm ci --no-audit --no-fund

      - name: Install gdown
        run: python3 -m pip install --user --quiet gdown

      - name: Download the identified clips from Drive
        run: |
          mkdir -p export/video_files
          count=$(node -e 'console.log(require("./media/drive-files.json").length)')
          echo "downloading $count clips by id"
          node -e 'for (const c of require("./media/drive-files.json")) console.log(c.key, c.id)' \
          | while read key id; do
              out="export/video_files/${key}.mp4"
              python3 -m gdown --quiet -O "$out" "https://drive.google.com/uc?id=${id}" || {
                echo "::error::could not download ${key} (${id}) — is the video_files folder shared 'anyone with the link'?"; exit 1;
              }
              # gdown writes an HTML page instead of the file when access is denied; catch that.
              if head -c 15 "$out" | grep -qi '<!DOCTYPE\|<html'; then
                echo "::error::${key} came back as an HTML page, not a video — the folder is not link-shared"; exit 1;
              fi
              echo "  ok  ${key}  ($(du -h "$out" | cut -f1))"
            done
          ls -1 export/video_files | wc -l

      - name: Transcode (merges into manifest, never clears an id)
        run: node scripts/media/prepare-videos.mjs export --out media/clips

      - name: Upload to Supabase (or preview when dry_run)
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/media/upload-videos.mjs --dir media/clips --lang "${{ inputs.lang }}" --dry-run
          else
            node scripts/media/upload-videos.mjs --dir media/clips --lang "${{ inputs.lang }}"
          fi
