<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="dark" />
    <meta name="supported-color-schemes" content="dark" />
    <title>Forma — код для входа</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0b0b0d; color: #f4f4f6">
    <!-- Preheader: shown in the inbox preview so the code is visible without opening the email. -->
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        font-size: 1px;
        line-height: 1px;
        color: #0b0b0d;
        opacity: 0;
      "
    >
      Код для входа: {{ .Token }}
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #0b0b0d; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 480px; margin: 0 auto"
          >
            <!-- Brand -->
            <tr>
              <td style="padding: 0 8px 20px 8px">
                <span
                  style="
                    font-family:
                      'Manrope',
                      -apple-system,
                      'Segoe UI',
                      Roboto,
                      Arial,
                      sans-serif;
                    font-size: 26px;
                    line-height: 1;
                    font-weight: 800;
                    letter-spacing: -0.5px;
                    color: #f4f4f6;
                  "
                  >FORMA<span style="color: #9ecbff">.</span></span
                >
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td
                style="
                  background-color: #151519;
                  border: 1px solid rgba(255, 255, 255, 0.08);
                  border-radius: 24px;
                  padding: 28px 24px;
                  font-family:
                    'Manrope',
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Arial,
                    sans-serif;
                "
              >
                <!-- RU -->
                <p
                  style="
                    margin: 0 0 8px 0;
                    font-size: 20px;
                    line-height: 1.3;
                    font-weight: 700;
                    color: #f4f4f6;
                  "
                >
                  Твой код для входа
                </p>
                <p style="margin: 0 0 20px 0; font-size: 15px; line-height: 1.5; color: #a8a8b2">
                  Введи этот код в приложении Forma. Он действует 10 минут.
                </p>

                <!-- Token -->
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      align="center"
                      style="
                        background-color: #1e1e24;
                        border-radius: 16px;
                        padding: 22px 16px;
                        font-family:
                          'Manrope',
                          -apple-system,
                          'Segoe UI',
                          Roboto,
                          Arial,
                          sans-serif;
                        font-size: 40px;
                        line-height: 1;
                        font-weight: 700;
                        letter-spacing: 10px;
                        color: #9ecbff;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>

                <p style="margin: 20px 0 0 0; font-size: 13px; line-height: 1.5; color: #93939d">
                  Если ты не запрашивал(а) код — просто проигнорируй это письмо. Никому не сообщай
                  код: он даёт доступ к твоему аккаунту.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 20px 8px 0 8px;
                  font-family:
                    'Manrope',
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Arial,
                    sans-serif;
                  font-size: 12px;
                  line-height: 1.5;
                  color: #93939d;
                "
              >
                Письмо отправлено на {{ .Email }}<br />
                <a href="{{ .SiteURL }}" style="color: #a8a8b2; text-decoration: underline"
                  >{{ .SiteURL }}</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
